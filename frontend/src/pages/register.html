<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>註冊 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 420px; margin: 4rem auto;">
      <h2>建立帳號</h2>
      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>
      <form id="register-form" autocomplete="off">
        <div class="form-group">
          <label for="username">使用者名稱</label>
          <input type="text" id="username" name="username" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="password2">確認密碼</label>
          <input type="password" id="password2" name="password2" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">註冊</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">
        已經有帳號？ <a href="/pages/login.html">登入</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { api, showError, showSuccess } from '/main.js';

    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (!username || !email || !password) { showError('請完整填寫表單'); return; }
      if (password !== password2) { showError('兩次輸入的密碼不一致'); return; }

      try {
        const payload = { username, email, password };
        const res = await api.post('/register', payload);
        if (res && res.id) {
          showSuccess('註冊成功，請前往登入');
          setTimeout(() => window.location.href = '/pages/login.html', 800);
        } else {
          showError('註冊失敗，請稍後再試');
        }
      } catch (err) {
        showError(err.message || '註冊失敗');
      }
    });
  </script>
</body>
</html>
