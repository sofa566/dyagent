<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG 設定（已退場）- dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><h1>dyagent</h1></div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>

  <main class="container">
    <h2>RAG 設定頁已退場</h2>
    <div class="card" style="border-color:#f0d28c;background:#fff8e6;color:#7a5c19;margin-bottom:1rem;">
      Agent 不再綁定資料集。RAG 檢索改由聊天請求的 <code>selected_dataset_ids</code> 與
      <code>entity.dataset.*</code> 權限共同決策。
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <h3>請改用以下入口</h3>
      <p style="margin-bottom:0.5rem;">1) 管理資料集：<a href="/pages/rag-datasets.html">RAG 資料集管理</a></p>
      <p style="margin-bottom:0.5rem;">2) 管理資料權限：<a href="/pages/access-control.html">權限管理</a></p>
      <p style="margin-bottom:0.5rem;">3) 管理工具策略：<a href="/pages/dashboard.html">儀表板 / 工具策略治理</a></p>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a id="btn-back-agent" class="btn" href="/pages/agent-list.html">返回代理者列表</a>
      <a id="btn-back-llm" class="btn btn-primary" href="/pages/agent-llm.html">前往 LLM 設定</a>
    </div>
  </main>

  <script type="module">
    import { auth } from '/main.js';

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    const url = new URL(window.location.href);
    const agentId = String(url.searchParams.get('id') || '').trim();
    if (agentId) {
      document.getElementById('btn-back-llm').setAttribute('href', `/pages/agent-llm.html?id=${encodeURIComponent(agentId)}`);
    }
  </script>
</body>
</html>
