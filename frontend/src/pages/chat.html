<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    /* 整體字體 */
    body { font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif; }

    .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: calc(100vh - 220px); height: calc(100vh - 220px); }

    /* sidebar 改善 */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.75rem;
      overflow-y: auto;
    }
    .sidebar h3 { margin-bottom: 0.5rem; font-size: 1rem; }
    .conv-list { list-style: none; margin: 0; padding: 0; }
    .conv-item {
      padding: 0.55rem 0.65rem;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .conv-item:hover { background: #f1f5ff; }
    .conv-item.active { background: #eef2ff; border-color: #c7d2fe; }
    .conv-title { font-weight: 600; font-size: 0.95rem; }
    .conv-meta { color: var(--text-secondary); font-size: 0.8rem; }

    .chat-container { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    /* 聊天訊息區背景 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f8f9fc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      min-height: 0;
      margin-bottom: 0.5rem;
    }

    /* 訊息氣泡 */
    .message {
      margin-bottom: 1.25rem;
      padding: 0.85rem 1.1rem;
      border-radius: 16px;
      max-width: 78%;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .message.user {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.25);
    }
    .message.assistant {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* 輸入區 */
    .chat-input {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding: 0.75rem;
      border-top: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius) var(--radius);
      z-index: 4;
    }
    .chat-input textarea {
      flex: 1;
      resize: none;
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      border: 1.5px solid var(--border-color);
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .chat-input textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .btn-send {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      align-self: flex-end;
    }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-send:hover:not(:disabled) { opacity: 0.9; }

    .chat-input-left { position: relative; }
    .btn-plus {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 10px;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      color: #334155;
    }
    .btn-plus:hover { background: #f8fafc; }
    .attach-popover {
      position: absolute;
      left: 0;
      bottom: 46px;
      min-width: 180px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      padding: 6px;
      display: none;
      z-index: 20;
    }
    .attach-popover.open { display: block; }
    .attach-popover button {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .attach-popover button:hover { background: #f1f5f9; }
    .chat-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0.25rem 0 0.5rem;
      min-height: 1px;
    }
    .chat-attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      border: 1px solid #c7d2fe;
    }
    .chat-attachment-chip button {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-weight: 700;
      padding: 0;
      line-height: 1;
    }
    .attach-dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }
    .attach-dialog-backdrop.open { display: flex; }
    .attach-dialog {
      width: min(520px, 92vw);
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      padding: 14px;
    }
    .attach-dialog h4 { margin: 0 0 10px; }
    .attach-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .dataset-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      background: #f8fafc;
    }
    .dataset-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 6px;
    }
    .dataset-item:hover { background: #e2e8f0; }

    .agent-selector {
      margin-bottom: 1rem;
    }
    .conv-actions { position: relative; }
    .conv-menu-trigger { padding: 2px 8px; line-height: 1; }
    .conv-menu {
      position: absolute;
      top: 28px;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      min-width: 120px;
      padding: 4px;
      display: none;
      z-index: 8;
    }
    .conv-menu.open { display: block; }
    .conv-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-primary);
    }
    .conv-menu button:hover { background: #f1f5f9; }
    .conv-menu .danger { color: #b91c1c; }

    /* JSON syntax highlight */
    .json { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .json .json-key { color: #6b7280; }
    .json .json-string { color: #0ea5e9; }
    .json .json-number { color: #d97706; }
    .json .json-boolean { color: #c0392b; }
    .json .json-null { color: #64748b; font-style: italic; }

    /* Tool card badges/alerts */
    .tool-badge { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; background: #9ca3af; }
    .tool-badge.running { background: #f59e0b; }
    .tool-badge.ok { background: #198754; }
    .tool-badge.error { background: #c0392b; }
    .tool-alert { background: #fdecea; color: #7f1d1d; border: 1px solid #f5c2c0; padding: 6px; border-radius: 6px; margin-top: 6px; display: none; }

    /* Progress */
    .tool-progress { margin-top: 6px; background: #f1f5f9; border: 1px solid #e5e7eb; height: 8px; border-radius: 999px; overflow: hidden; display: none; }
    .tool-progress__bar { height: 100%; width: 0%; background: #60a5fa; transition: width 0.2s ease, background-color 0.2s ease; }
    .tool-progress__meta { display: none; margin-top: 4px; font-size: 12px; color: var(--text-secondary); }

    /* ReAct trace */
    /* ── Markdown 輸出樣式 ── */
    .markdown-body { line-height: 1.7; font-size: 0.95rem; overflow-wrap: anywhere; word-break: break-word; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
    .markdown-body h1 { font-size: 1.25em; } .markdown-body h2 { font-size: 1.1em; } .markdown-body h3 { font-size: 1em; }
    .markdown-body p { margin: 0.5em 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0.4em 0; }
    .markdown-body li { margin: 0.25em 0; }
    .markdown-body code { font-family: ui-monospace, 'Courier New', monospace; font-size: 0.88em; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .markdown-body pre { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0.6em 0; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .markdown-body pre code { background: transparent; color: inherit; padding: 0; font-size: 0.87em; }
    .markdown-body blockquote { border-left: 3px solid #c7d2fe; margin: 0.5em 0; padding: 4px 12px; color: var(--text-secondary); background: #f8faff; border-radius: 0 6px 6px 0; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.9em; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 6px 10px; }
    .markdown-body th { background: #f1f5f9; font-weight: 600; }
    .markdown-body a { color: #4f46e5; text-decoration: underline; overflow-wrap: anywhere; word-break: break-all; }
    .markdown-body hr { border: none; border-top: 1px solid var(--border-color); margin: 0.8em 0; }
    .agent-output { margin: 6px 0; }
    .agent-output-label { display: inline-block; font-size: 0.74rem; font-weight: 700; color: #4f46e5; background: #eef2ff; border-radius: 4px; padding: 1px 6px; margin-bottom: 4px; }
    .message.user .markdown-body a { color: #c7d2fe; }

    /* routeInfo 樣式 */
    .route-info {
      display: inline-block;
      font-size: 0.75rem;
      color: #6366f1;
      background: #eef2ff;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .route-info.orchestrator-done {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #065f46;
      font-weight: 700;
    }

    /* orchestrator 計畫 */
    .orchestrator-plan {
      margin: 8px 0 10px;
      padding: 10px 12px;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      background: linear-gradient(135deg, #f0f4ff, #eef2ff);
      font-size: 0.88rem;
    }
    .orchestrator-plan-header {
      font-weight: 700;
      color: #4338ca;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .orchestrator-task-list {
      margin: 6px 0 0;
      padding-left: 20px;
    }
    .orchestrator-task-list li {
      margin: 4px 0;
      color: var(--text-secondary);
      font-size: 0.87rem;
    }

    /* agent badges */
    .agent-task-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-right: 6px;
      background: #e9ecef;
      color: #666;
      letter-spacing: 0.02em;
    }
    .agent-task-badge.running { background: #fef3c7; color: #d97706; }
    .agent-task-badge.done { background: #d1fae5; color: #065f46; }
    .agent-task-badge.error { background: #fee2e2; color: #991b1b; }
    .agent-text-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 8px 0 4px;
      width: fit-content;
      cursor: pointer;
      user-select: none;
    }
    .agent-detail { margin: 6px 0; }
    .agent-detail summary { list-style: none; }
    .agent-detail summary::before { content: '▶ '; font-size: 0.7rem; }
    .agent-detail[open] summary::before { content: '▼ '; }
    .agent-markdown { margin: 6px 0 4px; padding: 8px 10px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e5e7eb; }
    .synthesis-divider { border: none; border-top: 2px solid #c7d2fe; margin: 14px 0 8px; }
    .synthesis-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4338ca;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      border-radius: 6px;
      padding: 3px 10px;
      margin-bottom: 8px;
      width: fit-content;
      letter-spacing: 0.03em;
    }

    /* tool card */
    .tool-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
      margin: 8px 0;
      background: #fcfcfe;
    }

    @media (max-width: 900px) {
      .chat-layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 220px); }
      .chat-container { min-height: calc(100vh - 340px); }
      .message { max-width: 92%; }
    }
    @media (max-width: 600px) {
      .attach-popover {
        left: 0;
        right: auto;
        bottom: 44px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>dyagent</h1>
    </div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>聊天</h2>
    <div id="error-message" class="error-message"></div>
    <div class="agent-selector">
      <label for="agent-select">選擇代理者：</label>
      <select id="agent-select">
        <option value="">請選擇代理者</option>
      </select>
    </div>
    <div class="chat-layout">
      <aside class="sidebar">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <h3 style="margin:0;">聊天紀錄</h3>
          <button id="new-conv" class="btn btn-secondary" type="button">新對話</button>
        </div>
        <ul id="conv-list" class="conv-list"></ul>
        <div id="conv-empty" class="conv-meta" style="display:none; text-align:center; padding: 0.5rem;">尚無聊天紀錄</div>
      </aside>
      <section class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <p id="chat-initial-hint" style="text-align: center; color: var(--text-secondary);">請選擇代理者開始對話</p>
        </div>
        <div id="chat-attachments" class="chat-attachments"></div>
        <form id="chat-form" class="chat-input">
          <div class="chat-input-left">
            <button id="attach-trigger" class="btn-plus" type="button" title="加入輸入">＋</button>
            <div id="attach-popover" class="attach-popover" role="menu" aria-hidden="true">
              <button id="attach-upload" type="button">上傳檔案</button>
              <button id="attach-url" type="button">參考網頁</button>
              <button id="attach-dataset" type="button">使用資料集</button>
              <button id="attach-google" type="button">加入谷歌雲端檔案</button>
            </div>
            <input id="attach-file-input" type="file" multiple style="display:none;" />
          </div>
          <textarea id="message-input" rows="2" placeholder="輸入訊息… (Enter 送出，Alt+Enter 換行)" disabled></textarea>
          <button type="submit" class="btn-send" disabled>送出 ↵</button>
        </form>
      </section>
    </div>

    <div id="url-dialog-backdrop" class="attach-dialog-backdrop" aria-hidden="true">
      <div class="attach-dialog">
        <h4>參考網頁</h4>
        <label for="url-dialog-input">網址</label>
        <input id="url-dialog-input" type="url" placeholder="https://example.com" />
        <div class="actions">
          <button id="url-dialog-cancel" type="button" class="btn">取消</button>
          <button id="url-dialog-save" type="button" class="btn btn-primary">加入</button>
        </div>
      </div>
    </div>

    <div id="dataset-dialog-backdrop" class="attach-dialog-backdrop" aria-hidden="true">
      <div class="attach-dialog">
        <h4>使用資料集</h4>
        <input id="dataset-search-input" type="text" placeholder="搜尋資料集名稱" />
        <div id="dataset-dialog-list" class="dataset-list" style="margin-top:8px;"></div>
        <div class="actions">
          <button id="dataset-dialog-cancel" type="button" class="btn">取消</button>
          <button id="dataset-dialog-save" type="button" class="btn btn-primary">加入</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError } from '/main.js';
    import { marked } from 'marked';
    marked.setOptions({ breaks: true, gfm: true });

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    const currentUser = auth.getUser() || {};
    const autoRoutingMode = String(currentUser.role || '') === 'user';

    const agentSelect = document.getElementById('agent-select');
    const agentSelectorWrap = document.querySelector('.agent-selector');
    const chatMessages = document.getElementById('chat-messages');
    const chatInitialHint = document.getElementById('chat-initial-hint');
    const convList = document.getElementById('conv-list');
    const convEmpty = document.getElementById('conv-empty');
    const newConvBtn = document.getElementById('new-conv');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const submitBtn = chatForm.querySelector('.btn-send');
    const attachmentTray = document.getElementById('chat-attachments');
    const attachTrigger = document.getElementById('attach-trigger');
    const attachPopover = document.getElementById('attach-popover');
    const attachUploadBtn = document.getElementById('attach-upload');
    const attachUrlBtn = document.getElementById('attach-url');
    const attachDatasetBtn = document.getElementById('attach-dataset');
    const attachGoogleBtn = document.getElementById('attach-google');
    const attachFileInput = document.getElementById('attach-file-input');
    const urlDialogBackdrop = document.getElementById('url-dialog-backdrop');
    const urlDialogInput = document.getElementById('url-dialog-input');
    const urlDialogCancel = document.getElementById('url-dialog-cancel');
    const urlDialogSave = document.getElementById('url-dialog-save');
    const datasetDialogBackdrop = document.getElementById('dataset-dialog-backdrop');
    const datasetDialogList = document.getElementById('dataset-dialog-list');
    const datasetSearchInput = document.getElementById('dataset-search-input');
    const datasetDialogCancel = document.getElementById('dataset-dialog-cancel');
    const datasetDialogSave = document.getElementById('dataset-dialog-save');

    const TEXT_FILE_MAX_BYTES = 200 * 1024;
    const ATTACHMENT_TEXT_TOTAL_MAX = 600 * 1024;

    const attachmentsState = {
      files: [],
      urls: [],
      datasets: [],
      googleFiles: [],
    };
    let allRagDatasets = [];
    let googleAccessToken = '';
    let googleTokenClient = null;
    let googlePickerReady = false;
    let googlePickerConfigCache = null;

    function closeAttachPopover() {
      attachPopover.classList.remove('open');
      attachPopover.setAttribute('aria-hidden', 'true');
    }

    function openAttachPopover() {
      attachPopover.classList.add('open');
      attachPopover.setAttribute('aria-hidden', 'false');
    }

    function toHumanFileSize(bytes) {
      const size = Number(bytes || 0);
      if (!Number.isFinite(size) || size <= 0) return '0 B';
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    function pushUniqueUrl(url) {
      if (!attachmentsState.urls.some((u) => u === url)) {
        attachmentsState.urls.push(url);
      }
    }

    function removeAttachment(kind, key) {
      if (kind === 'file') {
        attachmentsState.files = attachmentsState.files.filter((x) => x.id !== key);
      } else if (kind === 'url') {
        attachmentsState.urls = attachmentsState.urls.filter((x) => x !== key);
      } else if (kind === 'dataset') {
        attachmentsState.datasets = attachmentsState.datasets.filter((x) => x.id !== key);
      } else if (kind === 'gfile') {
        attachmentsState.googleFiles = attachmentsState.googleFiles.filter((x) => x.id !== key);
      }
      renderAttachmentTray();
    }

    function renderAttachmentTray() {
      attachmentTray.innerHTML = '';
      const chips = [];
      attachmentsState.files.forEach((f) => {
        chips.push({ kind: 'file', key: f.id, label: `檔案：${f.name}` });
      });
      attachmentsState.urls.forEach((u) => {
        chips.push({ kind: 'url', key: u, label: `網頁：${u}` });
      });
      attachmentsState.datasets.forEach((d) => {
        chips.push({ kind: 'dataset', key: d.id, label: `資料集：${d.name}` });
      });
      attachmentsState.googleFiles.forEach((g) => {
        chips.push({ kind: 'gfile', key: g.id, label: `Google：${g.name}` });
      });
      chips.forEach((chip) => {
        const el = document.createElement('span');
        el.className = 'chat-attachment-chip';
        const text = document.createElement('span');
        text.textContent = chip.label;
        const close = document.createElement('button');
        close.type = 'button';
        close.textContent = '×';
        close.addEventListener('click', () => removeAttachment(chip.kind, chip.key));
        el.appendChild(text);
        el.appendChild(close);
        attachmentTray.appendChild(el);
      });
    }

    function escapeForPrompt(text) {
      return String(text || '').replace(/```/g, "'''\n");
    }

    function buildAttachmentContext() {
      const lines = [];
      let summaryCount = 0;

      if (attachmentsState.urls.length > 0) {
        summaryCount += attachmentsState.urls.length;
        lines.push('參考網頁:');
        attachmentsState.urls.forEach((u) => {
          lines.push(`- ${u}`);
          const exportUrl = toGoogleDocExportUrl(u);
          if (exportUrl) {
            lines.push(`  (Google 文件可讀取匯出連結) ${exportUrl}`);
          }
        });
      }

      if (attachmentsState.datasets.length > 0) {
        summaryCount += attachmentsState.datasets.length;
        lines.push('使用資料集:');
        attachmentsState.datasets.forEach((d) => lines.push(`- ${d.name} (id=${d.id}, scope=${d.scope || 'unknown'})`));
      }

      if (attachmentsState.googleFiles.length > 0) {
        summaryCount += attachmentsState.googleFiles.length;
        lines.push('Google 雲端檔案:');
        attachmentsState.googleFiles.forEach((g) => {
          const url = g.url || '';
          lines.push(`- ${g.name} (id=${g.id}${url ? `, url=${url}` : ''})`);
        });
      }

      if (attachmentsState.files.length > 0) {
        summaryCount += attachmentsState.files.length;
        lines.push('上傳檔案:');
        attachmentsState.files.forEach((f) => {
          lines.push(`- ${f.name} (${toHumanFileSize(f.size)})`);
          if (f.textContent) {
            lines.push(`<檔案內容 ${f.name}>`);
            lines.push(escapeForPrompt(f.textContent));
            lines.push(`</檔案內容 ${f.name}>`);
          }
        });
      }

      if (lines.length === 0) return { contextText: '', summaryText: '' };
      return {
        contextText: `\n\n[附加輸入]\n${lines.join('\n')}`,
        summaryText: `（已附加 ${summaryCount} 個項目）`,
      };
    }

    function toGoogleDocExportUrl(urlText) {
      try {
        const url = new URL(String(urlText || '').trim());
        const host = (url.hostname || '').toLowerCase();
        if (!host.includes('docs.google.com')) return '';
        const path = url.pathname || '';
        const match = path.match(/\/document\/d\/([^/]+)/);
        if (!match || !match[1]) return '';
        return `https://docs.google.com/document/d/${match[1]}/export?format=txt`;
      } catch {
        return '';
      }
    }

    async function readTextFileMaybe(file) {

      const textExt = ['.txt', '.md', '.csv', '.json', '.yaml', '.yml', '.xml', '.html', '.htm', '.js', '.ts', '.py', '.sh', '.log'];
      const isTextMime = String(file.type || '').startsWith('text/');
      const isTextExt = textExt.some((ext) => name.endsWith(ext));
      if (!(isTextMime || isTextExt)) return '';
      if (Number(file.size || 0) > TEXT_FILE_MAX_BYTES) return '';
      return await file.text();

    function loadScriptOnce(src) {
      return new Promise((resolve, reject) => {
        const exists = [...document.querySelectorAll('script')].find((s) => s.src === src);
        if (exists) {
          if (exists.dataset.loaded === '1') { resolve(); return; }
          exists.addEventListener('load', () => resolve(), { once: true });
          exists.addEventListener('error', (e) => reject(e), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.defer = true;
        script.onload = () => {
          script.dataset.loaded = '1';
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function openGooglePickerWithToken(token, apiKey) {
      const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false);
      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(apiKey)
        .setOAuthToken(token)
        .addView(view)
        .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
        .setCallback((data) => {
          if (data.action !== google.picker.Action.PICKED) return;
          const docs = Array.isArray(data.docs) ? data.docs : [];
          docs.forEach((doc) => {
            const id = String(doc.id || '');
            if (!id) return;
            if (attachmentsState.googleFiles.some((x) => x.id === id)) return;
            attachmentsState.googleFiles.push({
              id,
              name: String(doc.name || id),
              mimeType: String(doc.mimeType || ''),
              url: String(doc.url || ''),
            });
          });
          renderAttachmentTray();
        })
        .build();
      picker.setVisible(true);
    }

      if (!googleTokenClient) {
        googleTokenClient = google.accounts.oauth2.initTokenClient({

          callback: (tokenResponse) => {
            if (!tokenResponse || !tokenResponse.access_token) {
              showError('Google OAuth 授權失敗');

    function updateProgress(meta, value, etaSeconds) {
      if (!meta || !meta.bar) return;
      let v = Number(value);
      if (Number.isNaN(v)) return;
      v = Math.max(0, Math.min(100, Math.round(v)));
      meta._progress = v;
      meta.bar.style.width = v + '%';
      // 色彩從紅(0)到綠(120)之間漸變
      const hue = Math.round((v / 100) * 120);
      meta.bar.style.backgroundColor = `hsl(${hue}, 70%, 50%)`;
      // 估算/顯示剩餘時間
      let etaText = '';
      if (typeof etaSeconds === 'number' && isFinite(etaSeconds) && etaSeconds >= 0) {
        etaText = ` · ${formatSeconds(etaSeconds)} 剩餘`;
      } else {
        const now = Date.now();
        if (meta._lastTs != null && v > meta._lastProg) {
          const dp = v - meta._lastProg;
          const dt = (now - meta._lastTs) / 1000; // s
          const speed = dp / dt; // % per s
          if (speed > 0 && v < 100) {
            const remain = (100 - v) / speed; // s
            if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
          }
        } else if (v > 0) {
          const elapsed = (now - (meta._t0 || now)) / 1000; // s
          const remain = elapsed * (100 - v) / v;
          if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
        }
        meta._lastTs = now;
        meta._lastProg = v;
      }
      if (meta.progMeta) meta.progMeta.textContent = v + '%' + etaText;
      if (v >= 100 && meta._state === 'running') {
        // 自動標記完成
        setCardStatus(meta, 'ok');
      }
    }

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

          const router = (agents || []).find((a) => !!a.is_router || String(a.agent_class || '').toLowerCase() === 'master');
          const initial = (router && router.id) ? router.id : ((agents[0] && agents[0].id) || '');
          if (initial) {
            currentAgentId = initial;
            routerAgentId = initial;   // 記住主代理 ID
            await selectAgent(initial);
          } else {
            chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">目前沒有可用代理者，請聯絡管理者。</p>';
          }
        } else {
          const initial = agentParam || lastAgent;
          if (initial && [...agentSelect.options].some(o => o.value === initial)) {
            agentSelect.value = initial;
            selectAgent(initial);
          }
        }
      } catch (error) {
        showError(error.message);
      }
    }

    async function selectAgent(agentId) {
      currentAgentId = agentId;
      messageInput.disabled = false;
      submitBtn.disabled = false;
      localStorage.setItem('last_agent_id', agentId);

      try {
        // 側欄載入中狀態
        convEmpty.style.display = 'none';
        convList.innerHTML = '<li class="conv-item"><div class="conv-meta">載入中…</div></li>';
        // auto-routing 模式取得全部對話（跨 agent），非 auto-routing 取得指定 agent 的對話
        const convUrl = autoRoutingMode ? '/conversations' : `/agents/${agentId}/conversations`;
        const response = await api.get(convUrl);
        currentConversations = Array.isArray(response.conversations) ? response.conversations : [];
        renderSidebar(currentConversations);
        if (currentConversations.length > 0) {

          chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">載入中…</p>';
          renderMessagesById(currentConversationId);
        } else {
          chatMessages.innerHTML = '<p style="text-align: center;">可以開始對話了</p>';
        }
        // 不在前端進行 LLM 暖機，避免主代理或未配置模型造成噪音錯誤
      } catch (error) {
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--error-color);">載入失敗，請稍後再試</p>';
      }
    }

    function mergeConversationsWithLocalFallback(refreshedConversations, previousConversations, preferredConversationId) {
      const refreshed = Array.isArray(refreshedConversations) ? [...refreshedConversations] : [];
      const previous = Array.isArray(previousConversations) ? previousConversations : [];
      if (!preferredConversationId) return refreshed;

      const localConv = previous.find((c) => c && c.id === preferredConversationId);
      if (!localConv || !Array.isArray(localConv.messages) || localConv.messages.length === 0) {
        return refreshed;
      }

      const remoteIndex = refreshed.findIndex((c) => c && c.id === preferredConversationId);
      if (remoteIndex < 0) {
        return [localConv, ...refreshed];
      }

      const remoteConv = refreshed[remoteIndex] || {};
      const remoteCount = Array.isArray(remoteConv.messages) ? remoteConv.messages.length : 0;
      const localCount = localConv.messages.length;
      if (remoteCount >= localCount) {
        return refreshed;
      }

      refreshed[remoteIndex] = {
        ...remoteConv,
        messages: localConv.messages,
      };
      return refreshed;
    }

    async function renderMessagesById(convId) {
      const thisRenderRevision = ++renderRevision;
      const conv = (currentConversations || []).find(c => c.id === convId);
      if (!conv) return;
      let routeLabels = [];
      try {
        const routeRes = await api.get(`/conversations/${convId}/events?types=route.decision`);
        const routeEvents = Array.isArray(routeRes.events) ? routeRes.events : [];
        routeLabels = routeEvents.map((e) => {
          const payload = (e && e.payload) || {};
          const target = payload.target_agent_name
            ? String(payload.target_agent_name)
            : (payload.target_agent_id ? String(payload.target_agent_id) : '未知代理');
          const reason = payload.reason ? `（${String(payload.reason)}）` : '';
          const degraded = payload.degraded ? ' [降級]' : '';
          return `本輪由：${target} 代理者回覆${reason}${degraded}`;
        }).filter(Boolean);
      } catch {}

      if (thisRenderRevision !== renderRevision || convId !== currentConversationId) return;

      let assistantTurnIndex = 0;
      chatMessages.innerHTML = (conv.messages || []).map(msg => {
        let body = `<p>${escapeHTML(msg.content || '')}</p>`;
        if (msg.role === 'assistant') {
          const routeLabel = routeLabels[assistantTurnIndex] || '';
          assistantTurnIndex += 1;
          const routeBanner = routeLabel
            ? `<div class="route-info">${escapeHTML(routeLabel)}</div>`
            : '';
          const parsed = parseProtocolArtifacts(msg.content || '');
          const cleanedAssistantText = stripToolProtocolText(parsed.cleaned || '');
          const protocolDebug = SHOW_PROTOCOL_DEBUG && (parsed.blocks || []).length > 0
            ? `<details class="agent-detail"><summary class="agent-text-label">工具呼叫協定（除錯）</summary><pre class="code" style="white-space:pre-wrap;margin-top:6px;">${escapeHTML((parsed.blocks || []).join('\n\n'))}</pre></details>`
            : '';
          body = `${routeBanner}${protocolDebug}<div class="markdown-body">${marked.parse(cleanedAssistantText)}</div>`;
        }
        return `<div class="message ${msg.role}">${body}<small style="opacity:0.7;">${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</small></div>`;
      }).join('');
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // 載入並渲染此對話的工具事件（持久化卡片）
      (async () => {
        if (!SHOW_PERSISTED_TOOL_EVENTS) return;
        try {
          const ev = await api.get(`/conversations/${convId}/events?types=tool_input,tool_result,tool_error`);
          const list = Array.isArray(ev.events) ? ev.events : [];
          list.forEach(e => {
            if (!e || !e.type) return;
            // 僅將 result/error 呈現為卡片；input 可作為後續擴充
            if (e.type === 'tool_result' || e.type === 'tool_error') {
              const name = (e.payload && e.payload.tool) ? e.payload.tool : 'tool';
              const meta = createToolCard(name);
              // result: 目前 payload 為 { tool, keys: [...] } 或完整 frame（若可用）
              // error: { tool, error }
              if (e.type === 'tool_error') {
                setCardStatus(meta, 'error', (e.payload && e.payload.error) || '執行失敗');
                appendFrame(meta.body, e.payload || {});
              } else {
                setCardStatus(meta, 'ok');
                appendFrame(meta.body, e.payload || {});
              }
              const holder = document.createElement('div');
              holder.appendChild(meta.card);
              chatMessages.appendChild(holder);
            }
          });
        } catch {}
      })();
    }

    // 安全轉義與簡易 JSON 語法高亮
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function _extractJsonToolCallsBlocks(text) {
      let cleaned = String(text || '');
      const blocks = [];
      while (true) {
        const markerIndex = cleaned.indexOf('"tool_calls"');
        if (markerIndex < 0) break;
        const start = cleaned.lastIndexOf('{', markerIndex);
        if (start < 0) break;
        let depth = 0;
        let inString = false;
        let escapeNext = false;
        let end = -1;
        for (let i = start; i < cleaned.length; i += 1) {
          const ch = cleaned[i];
          if (escapeNext) {
            escapeNext = false;
            continue;
          }
          if (ch === '\\') {
            escapeNext = true;
            continue;
          }
          if (ch === '"') {
            inString = !inString;
            continue;
          }
          if (inString) continue;
          if (ch === '{') depth += 1;
          if (ch === '}') {
            depth -= 1;
            if (depth === 0) {
              end = i;
              break;
            }
          }
        }
        if (end < 0) break;
        const candidate = cleaned.slice(start, end + 1);
        if (candidate.includes('"tool_calls"')) {
          blocks.push(candidate.trim());
          cleaned = cleaned.slice(0, start) + cleaned.slice(end + 1);
          continue;
        }
        break;
      }
      return { cleaned, blocks };
    }

    function parseProtocolArtifacts(text) {
      let cleaned = String(text || '');
      const blocks = [];
      const callRegex = /\[\[CALL tool=[^\]]+\]\]\s*(\{[\s\S]*?\})?/g;
      cleaned = cleaned.replace(callRegex, (m) => {
        blocks.push(String(m || '').trim());
        return '';
      });
      const parsedJsonBlocks = _extractJsonToolCallsBlocks(cleaned);
      cleaned = parsedJsonBlocks.cleaned;
      (parsedJsonBlocks.blocks || []).forEach((b) => blocks.push(b));
      return { cleaned, blocks };
    }

    function stripToolProtocolText(text) {
      const parsed = parseProtocolArtifacts(text);
      let cleaned = String(parsed.cleaned || '');
      cleaned = cleaned.replace(/```json[\s\S]*?"tool_calls"[\s\S]*?```/gi, '');
      cleaned = cleaned.replace(/\{\s*"tool_calls"\s*:\s*\[[\s\S]*?\]\s*\}/gi, '');
      cleaned = cleaned.replace(/^\s*```json\s*$/gim, '');
      cleaned = cleaned.replace(/^\s*```\s*$/gim, '');
      cleaned = cleaned.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/gi, '');
      cleaned = cleaned.replace(/<\/?system-reminder>/gi, '');
      cleaned = cleaned.replace(/Your operational mode has changed[\s\S]{0,400}?tools as needed\./gi, '');
      cleaned = cleaned.replace(/Your operational mode has changed from plan to build\.\s*You are no longer in read-only mode\.\s*You are permitted to make file changes, run shell commands, and utilize your arsenal of tools as needed\./gi, '');
      cleaned = cleaned.replace(/^\s*Your operational mode has changed from plan to build\.\s*$/gim, '');
      cleaned = cleaned.replace(/^\s*You are no longer in read-only mode\.\s*$/gim, '');
      cleaned = cleaned.replace(/^\s*You are permitted to make file changes, run shell commands, and utilize your arsenal of tools as needed\.\s*$/gim, '');
      cleaned = cleaned.replace(/\[\[CALL[^\n\r]*$/gm, '');
      cleaned = cleaned.replace(/(?:^|\s)tool\s*=\s*[a-zA-Z0-9:_\-./]+/g, ' ');
      cleaned = cleaned.replace(/^\s*(?:tool\s*=\s*)?(?:mcp|cp):[a-zA-Z0-9_\-./]+\s*/i, '');
      cleaned = cleaned.replace(/^\s*[:：,，\-]+\s*/g, '');
      return cleaned.trim();
    }

    function syntaxHighlight(jsonText) {
      // 先整體轉義，確保安全
      let html = escapeHTML(jsonText);
      // 字串（含可能的鍵），先標記，再將作為鍵的字串（後接冒號）改為 key 樣式
      html = html.replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?/g, (match, group1, isKey) => {
        if (isKey) {
          return '<span class="json-key">' + group1 + '</span>:';
        }
        return '<span class="json-string">' + group1 + '</span>';
      });
      // 數字
      html = html.replace(/\b-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+\-]?\d+)?\b/g, (m) => '<span class="json-number">' + m + '</span>');
      // 布林與 null
      html = html.replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>');
      html = html.replace(/\bnull\b/g, '<span class="json-null">null</span>');
      return html;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = (messageInput.value || '').trim();
      if (!msg) return;
      const attachmentContext = buildAttachmentContext();
      const composedMessage = `${msg}${attachmentContext.contextText}`;
      if (!currentAgentId) {
        const firstSelectable = [...agentSelect.options].find((option) => !!option.value);
        if (firstSelectable) {
          currentAgentId = firstSelectable.value;
        } else {
          showError('目前沒有可用代理者，請先建立或啟用代理者');
          return;
        }
      }
      const STREAM_TIMEOUT_MS = 120000;
      messageInput.disabled = true;
      submitBtn.disabled = true;
      const activeConversation = (currentConversations || []).find((c) => c.id === currentConversationId);
      if (activeConversation) {
        if (!Array.isArray(activeConversation.messages)) activeConversation.messages = [];
        activeConversation.messages.push({
          id: `temp-user-${Date.now()}`,
          role: 'user',
          content: composedMessage,
          timestamp: new Date().toISOString(),
        });
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<p>${escapeHTML(msg)}</p>${attachmentContext.summaryText ? `<p style="margin-top:6px;font-size:0.8rem;opacity:0.9;">${escapeHTML(attachmentContext.summaryText)}</p>` : ''}`;
      chatMessages.appendChild(userMsg);
      // 建立助理訊息區塊
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      const routeInfo = document.createElement('div');
      routeInfo.className = 'route-info';
      routeInfo.textContent = '主代理分派中…';
      const p = document.createElement('div');
      p.className = 'markdown-body';
      assistantMsg.appendChild(routeInfo);
      assistantMsg.appendChild(p);
      chatMessages.appendChild(assistantMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      // ── Markdown 累積（宣告在 try 外，catch 也能存取）──
      let accText = '';                   // 單代理累積文字
      const agentAccTexts = new Map();    // task_index → 子代理累積文字
      const agentDivs = new Map();        // task_index → 子代理渲染 div
      let orchestratorPlanEl = null;      // 任務清單容器
      const agentTaskBadges = new Map();  // task_index → badge element
      let hidingToolProtocol = false;
      let protocolDetailEl = null;
      let protocolPreEl = null;
      const protocolSeenBlocks = new Set();

      function ensureProtocolPanel() {
        if (!SHOW_PROTOCOL_DEBUG) return;
        if (protocolDetailEl && protocolPreEl) return;
        protocolDetailEl = document.createElement('details');
        protocolDetailEl.className = 'agent-detail';
        const summary = document.createElement('summary');
        summary.className = 'agent-text-label';
        summary.textContent = '工具呼叫協定（除錯）';
        protocolPreEl = document.createElement('pre');
        protocolPreEl.className = 'code';
        protocolPreEl.style.whiteSpace = 'pre-wrap';
        protocolPreEl.style.marginTop = '6px';
        protocolDetailEl.appendChild(summary);
        protocolDetailEl.appendChild(protocolPreEl);
        assistantMsg.insertBefore(protocolDetailEl, p);
      }

      function extractProtocolBlocks(text) {
        return parseProtocolArtifacts(text);
      }

      function appendProtocolBlocks(blocks) {
        if (!SHOW_PROTOCOL_DEBUG) return;
        if (!Array.isArray(blocks) || blocks.length === 0) return;
        const unseen = [];
        blocks.forEach((b) => {
          const key = String(b || '').trim();
          if (!key) return;
          if (protocolSeenBlocks.has(key)) return;
          protocolSeenBlocks.add(key);
          unseen.push(key);
        });
        if (unseen.length === 0) return;
        ensureProtocolPanel();
        const now = new Date().toLocaleTimeString();
        const lines = unseen.map((b) => `[${now}]\n${b}`).join('\n\n');
        protocolPreEl.textContent = (protocolPreEl.textContent ? `${protocolPreEl.textContent}\n\n` : '') + lines;
      }

      // 串流聊天
      let sendSucceeded = false;
      try {
        const token = localStorage.getItem('auth_token');
        const selected = (agentRegistry || []).find((a) => String(a.id) === String(currentAgentId));
        const useUnifiedEntry = !!autoRoutingMode || !!(selected && selected.is_router) || hasAnyAttachments();
        const url = useUnifiedEntry
          ? '/api/chat'
          : (`/api/agents/${currentAgentId}/chat/stream?` + new URLSearchParams({ message: composedMessage }));
        const controller = new AbortController();
        // timer 改為「每收到事件就重置」：從最後一個事件起算 STREAM_TIMEOUT_MS
        let timer = setTimeout(() => controller.abort('timeout'), STREAM_TIMEOUT_MS);
        const resetTimer = () => { clearTimeout(timer); timer = setTimeout(() => controller.abort('timeout'), STREAM_TIMEOUT_MS); };
        let resp = await fetch(url, {
          method: useUnifiedEntry ? 'POST' : 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
          },
          body: useUnifiedEntry ? JSON.stringify({ message: composedMessage }) : undefined,
          signal: controller.signal,
        });
        if (!resp.ok && resp.status === 503) {
          // 後端重啟或模型路由短暫不可用時，做一次短暫重試
          await new Promise((r) => setTimeout(r, 1200));
          resp = await fetch(url, {
            method: useUnifiedEntry ? 'POST' : 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
            },
            body: useUnifiedEntry ? JSON.stringify({ message: composedMessage }) : undefined,
            signal: controller.signal,
          });
        }
        if (!resp.ok || !resp.body) {
          clearTimeout(timer);
          p.textContent = `串流失敗：HTTP ${resp.status}`;
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let sawDoneEvent = false;
        let doneConversationId = null;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!chunk.startsWith('data: ')) continue;
            resetTimer(); // 每收到一個事件就重置逾時計時器
            try {
              const payload = JSON.parse(chunk.replace(/^data:\s*/, ''));
              if (!['heartbeat','text'].includes(payload.type)) console.log('[SSE]', payload.type, JSON.stringify(payload).slice(0,120));
              if (payload.type === 'text' && typeof payload.delta === 'string') {
                const deltaText = stripToolProtocolText(payload.delta);
                if (!deltaText) {
                  continue;
                }
                if (hidingToolProtocol) {
                  if (deltaText.includes(']]')) {
                    hidingToolProtocol = false;
                  }
                  continue;
                }
                const callIndex = deltaText.indexOf('[[CALL');
                if (callIndex >= 0) {
                  const visiblePart = deltaText.slice(0, callIndex);
                  if (visiblePart) accText += visiblePart;
                  hidingToolProtocol = true;
                } else {
                  accText += deltaText;
                }
                const extracted = extractProtocolBlocks(accText);
                appendProtocolBlocks(extracted.blocks);
                accText = stripToolProtocolText(extracted.cleaned);
                p.innerHTML = marked.parse(accText);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (payload.type === 'route.decision') {
                const reasonText = payload.reason ? `（${String(payload.reason)}）` : '';
                const degradedText = payload.degraded ? ' [降級]' : '';
                if (payload.target_agent_name) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_name)} 代理者回覆${reasonText}${degradedText}`;
                } else if (payload.target_agent_id) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_id)} 代理者回覆${reasonText}${degradedText}`;
                }
                if (payload.target_agent_id) {
                  currentAgentId = String(payload.target_agent_id);
                  if (!autoRoutingMode) {
                    try { agentSelect.value = String(payload.target_agent_id); } catch {}
                  }
                }
              } else if (payload.type === 'debug') {
                console.debug('[CHAT DEBUG]', payload);
              } else if (payload.type === 'orchestrator.thinking') {
                routeInfo.textContent = payload.message || '多代理分析中…';
              } else if (payload.type === 'orchestrator.plan') {
                // 顯示多代理協作任務清單（可折疊）
                routeInfo.textContent = `多代理協作（第 ${payload.react_step || 1} 輪）`;
                if (!orchestratorPlanEl) {
                  orchestratorPlanEl = document.createElement('div');
                  orchestratorPlanEl.className = 'orchestrator-plan';
                  assistantMsg.insertBefore(orchestratorPlanEl, p);
                } else {
                  orchestratorPlanEl.innerHTML = '';
                  agentTaskBadges.clear();
                  agentAccTexts.clear();
                  agentDivs.clear();
                }
                const header = document.createElement('div');
                header.className = 'orchestrator-plan-header';
                header.textContent = `📋 協作計畫（${(payload.tasks || []).length} 個任務）`;
                header.style.cursor = 'pointer';
                const taskList = document.createElement('ul');
                taskList.className = 'orchestrator-task-list';
                header.addEventListener('click', () => {
                  taskList.style.display = taskList.style.display === 'none' ? '' : 'none';
                });
                (payload.tasks || []).forEach((t, i) => {
                  const li = document.createElement('li');
                  const badge = document.createElement('span');
                  badge.className = 'agent-task-badge';
                  badge.textContent = '待執行';
                  li.appendChild(badge);
                  li.append(` [${t.agent_name || t.agent_id || ''}] ${t.task || ''}`);
                  taskList.appendChild(li);
                  agentTaskBadges.set(t.task_index != null ? t.task_index : i, badge);
                });
                orchestratorPlanEl.appendChild(header);
                orchestratorPlanEl.appendChild(taskList);
              } else if (payload.type === 'agent.start') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '處理中…'; badge.className = 'agent-task-badge running'; }
              } else if (payload.type === 'agent.text' && typeof payload.delta === 'string') {
                const tIdx = payload.task_index;
                const isSynthesis = (tIdx === -1);
                if (!agentDivs.has(tIdx)) {
                  if (isSynthesis) {
                    // 合成結果：分隔線 + 標題 + 獨立 markdown div
                    const hr = document.createElement('hr');
                    hr.className = 'synthesis-divider';
                    const synLabel = document.createElement('div');
                    synLabel.className = 'synthesis-label';
                    synLabel.textContent = '綜合回覆';
                    const synDiv = document.createElement('div');
                    synDiv.className = 'markdown-body';
                    p.appendChild(hr);
                    p.appendChild(synLabel);
                    p.appendChild(synDiv);
                    agentDivs.set(tIdx, synDiv);
                  } else {
                    // 子代理：可折疊區塊
                    const details = document.createElement('details');
                    details.className = 'agent-detail';
                    const summary = document.createElement('summary');
                    summary.className = 'agent-text-label';
                    summary.textContent = `${payload.agent_name || '代理者'} 的回覆`;
                    const agentDiv = document.createElement('div');
                    agentDiv.className = 'markdown-body agent-markdown';
                    details.appendChild(summary);
                    details.appendChild(agentDiv);
                    p.appendChild(details);
                    agentDivs.set(tIdx, agentDiv);
                  }
                  agentAccTexts.set(tIdx, '');
                }
                let agentAcc = (agentAccTexts.get(tIdx) || '') + payload.delta;
                agentAcc = stripToolProtocolText(agentAcc);
                agentAccTexts.set(tIdx, agentAcc);
                agentDivs.get(tIdx).innerHTML = marked.parse(agentAcc);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (payload.type === 'agent.done') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '✓ 完成'; badge.className = 'agent-task-badge done'; }
              } else if (payload.type === 'agent.error') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '✗ 失敗'; badge.className = 'agent-task-badge error'; }
              } else if (payload.type === 'orchestrator.synthesizing') {
                routeInfo.textContent = `Router 合成中（第 ${payload.react_step || 1} 輪）…`;
              } else if (payload.type === 'orchestrator.retry') {
                routeInfo.textContent = `重新規劃中（第 ${(payload.react_step || 1) + 1} 輪）…`;
                // 新輪次清空文字區，準備接收新合成結果
                accText = '';
                p.innerHTML = '';
                agentAccTexts.clear();
                agentDivs.clear();
              } else if (payload.type === 'orchestrator.done') {
                routeInfo.textContent = `多代理協作完成（${payload.completed || 0} 個代理，共 ${payload.react_steps_used || 1} 輪）`;
                routeInfo.classList.add('orchestrator-done');
                try {
                  const refreshUrl = autoRoutingMode ? '/conversations' : `/agents/${currentAgentId}/conversations`;
                  const refreshed = await api.get(refreshUrl);
                  currentConversations = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
                  renderSidebar(currentConversations);
                } catch {}
              } else if (payload.type === 'tool_start') {
                hidingToolProtocol = false;
                const built = createToolCard(payload.name);
                built._toolName = payload.name;
                built._lastPayload = (payload.args && typeof payload.args === 'object') ? payload.args : {};
                built._convId = currentConversationId || built._convId;
                activeToolCard = built;
                assistantMsg.appendChild(built.card);
              } else if (payload.type === 'progress') {
                if (activeToolCard) updateProgress(activeToolCard, payload.value, payload.eta_seconds);
              } else if (payload.type === 'heartbeat') {
                if (activeToolCard && activeToolCard.progMeta && activeToolCard._state === 'running') {
                  const pct = typeof activeToolCard._progress === 'number' ? activeToolCard._progress : 0;
                  activeToolCard.progMeta.textContent = pct + '% · 仍在處理…';
                }
              } else if (payload.type === 'tool') {
                if (activeToolCard) {
                  appendFrame(activeToolCard.body, payload.frame);
                  if (payload.frame && payload.frame.ok === false)
                    setCardStatus(activeToolCard, 'error', payload.frame.error || '執行失敗');
                  else if (payload.frame && payload.frame.ok === true)
                    setCardStatus(activeToolCard, 'ok');
                  const f = payload.frame || {};
                  const cand = (typeof f.progress === 'number' ? f.progress
                    : (typeof f.percent === 'number' ? f.percent
                    : (typeof f.value === 'number' ? f.value : null)));
                  const eta = (typeof f.eta_seconds === 'number' ? f.eta_seconds
                    : (typeof f.eta === 'number' ? f.eta
                    : (typeof f.remaining_ms === 'number' ? f.remaining_ms / 1000 : null)));
                  if (cand !== null) updateProgress(activeToolCard, cand, eta);
                }
              } else if (payload.type === 'text_clear_tool') {
                hidingToolProtocol = false;
                const extracted = extractProtocolBlocks(accText);
                appendProtocolBlocks(extracted.blocks);
                accText = extracted.cleaned;
                if (p) p.innerHTML = marked.parse(accText);
              } else if (payload.type === 'done') {
                sawDoneEvent = true;
                doneConversationId = payload.conversation_id ? String(payload.conversation_id) : null;
                // 完成
                if (activeToolCard && activeToolCard._state === 'running') setCardStatus(activeToolCard, 'ok');
                if (activeToolCard && (!activeToolCard._convId) && payload.conversation_id) activeToolCard._convId = payload.conversation_id;
                const doneConvId = doneConversationId || currentConversationId;
                if (doneConvId && accText.trim()) {
                  const doneConv = (currentConversations || []).find((c) => c.id === doneConvId);
                  if (doneConv) {
                    if (!Array.isArray(doneConv.messages)) doneConv.messages = [];
                    const lastMsg = doneConv.messages[doneConv.messages.length - 1];
                    if (!lastMsg || lastMsg.role !== 'assistant') {
                      doneConv.messages.push({
                        id: `temp-assistant-${Date.now()}`,
                        role: 'assistant',
                        content: accText,
                        timestamp: new Date().toISOString(),
                      });
                    }
                  }
                }
                // 串流完成後，刷新側欄會話清單以更新最後互動時間與新會話
                try {
                  const previousConversations = Array.isArray(currentConversations) ? [...currentConversations] : [];
                  await new Promise((r) => setTimeout(r, 450));
                  const refreshed = await api.get('/conversations');
                  const refreshedList = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
                  currentConversations = mergeConversationsWithLocalFallback(
                    refreshedList,
                    previousConversations,
                    doneConversationId || currentConversationId,
                  );
                  if (doneConversationId) {
                    currentConversationId = doneConversationId;
                  } else if (currentConversationId && !currentConversations.some((c) => c.id === currentConversationId)) {
                    currentConversationId = currentConversations[0]?.id || null;
                  }
                  renderSidebar(currentConversations);
                  if (currentConversationId) {
                    await renderMessagesById(currentConversationId);
                  }
                } catch {}
              }
            } catch {}
          }
        }
        clearTimeout(timer);
        if (!sawDoneEvent) {
          try {
            const previousConversations = Array.isArray(currentConversations) ? [...currentConversations] : [];
            await new Promise((r) => setTimeout(r, 450));
            const refreshed = await api.get('/conversations');
            const refreshedList = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
            currentConversations = mergeConversationsWithLocalFallback(
              refreshedList,
              previousConversations,
              doneConversationId || currentConversationId,
            );
            if (currentConversations.length > 0) {
              if (doneConversationId) {
                currentConversationId = doneConversationId;
              } else if (!currentConversationId) {
                currentConversationId = currentConversations[0].id;
              } else if (!currentConversations.some((c) => c.id === currentConversationId)) {
                currentConversationId = currentConversations[0].id;
              }
              renderSidebar(currentConversations);
              if (currentConversationId) {
                await renderMessagesById(currentConversationId);
              }
            }
          } catch {}
        }
        sendSucceeded = true;
        messageInput.value = '';
        messageInput.style.height = 'auto';
      } catch (e) {
        const isTimeout = !!(e && (e.name === 'AbortError' || String(e.message || '').includes('timeout')));
        if (isTimeout) {
          accText += '\n\n系統忙碌中，請稍後再試。';
        } else {
          accText += `\n\n[錯誤] ${(e && e.message) || '串流錯誤'}`;
        }
        p.innerHTML = marked.parse(accText);
      } finally {
        messageInput.disabled = false;
        submitBtn.disabled = false;
        messageInput.value = '';
        messageInput.style.height = 'auto';
        if (sendSucceeded) clearAttachments();
        messageInput.focus();
      }
    });

    renderAttachmentTray();
    loadAgents();
    if (autoRoutingMode && chatInitialHint) {
      chatInitialHint.textContent = '可直接開始對話，系統會自動由主代理分派。';
    }
  </script>
</body>
</html>
