<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: calc(100vh - 220px); height: calc(100vh - 220px); }
    .sidebar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 0.75rem; overflow-y: auto; }
    .sidebar h3 { margin-bottom: 0.5rem; font-size: 1rem; }
    .conv-list { list-style: none; margin: 0; padding: 0; }
    .conv-item { padding: 0.5rem; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; }
    .conv-item:hover { background: #f8fafc; border-color: var(--border-color); }
    .conv-item.active { background: #eef2ff; border-color: var(--primary-color); }
    .conv-title { font-weight: 600; font-size: 0.95rem; }
    .conv-meta { color: var(--text-secondary); font-size: 0.8rem; }

    .chat-container { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: var(--bg-color);
      border-radius: var(--radius);
      min-height: 0;
      margin-bottom: 0.5rem;
    }
    .message {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      max-width: 80%;
    }
    .message.user {
      background: var(--primary-color);
      color: white;
      margin-left: auto;
    }
    .message.assistant {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-color);
      z-index: 4;
    }
    .chat-input input {
      flex: 1;
    }
    .agent-selector {
      margin-bottom: 1rem;
    }
    .conv-actions { position: relative; }
    .conv-menu-trigger { padding: 2px 8px; line-height: 1; }
    .conv-menu {
      position: absolute;
      top: 28px;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      min-width: 120px;
      padding: 4px;
      display: none;
      z-index: 8;
    }
    .conv-menu.open { display: block; }
    .conv-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-primary);
    }
    .conv-menu button:hover { background: #f1f5f9; }
    .conv-menu .danger { color: #b91c1c; }
    /* JSON syntax highlight */
    .json { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .json .json-key { color: #6b7280; }        /* slate-500 */
    .json .json-string { color: #0ea5e9; }     /* sky-500 */
    .json .json-number { color: #d97706; }     /* amber-600 */
    .json .json-boolean { color: #c0392b; }    /* red-600 */
    .json .json-null { color: #64748b; font-style: italic; } /* slate-500 */
    /* Tool card badges/alerts */
    .tool-badge { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; background: #9ca3af; }
    .tool-badge.running { background: #f59e0b; }
    .tool-badge.ok { background: #198754; }
    .tool-badge.error { background: #c0392b; }
    .tool-alert { background: #fdecea; color: #7f1d1d; border: 1px solid #f5c2c0; padding: 6px; border-radius: 6px; margin-top: 6px; display: none; }
    /* Progress */
    .tool-progress { margin-top: 6px; background: #f1f5f9; border: 1px solid #e5e7eb; height: 8px; border-radius: 999px; overflow: hidden; display: none; }
    .tool-progress__bar { height: 100%; width: 0%; background: #60a5fa; transition: width 0.2s ease, background-color 0.2s ease; }
    .tool-progress__meta { display: none; margin-top: 4px; font-size: 12px; color: var(--text-secondary); }
    .react-trace { margin-top: 8px; padding: 8px; border: 1px dashed var(--border-color); border-radius: 8px; background: #f8fafc; }
    .react-trace__title { font-weight: 600; margin-bottom: 4px; }
    .react-trace__list { margin: 0; padding-left: 18px; color: var(--text-secondary); font-size: 0.92rem; }
    .react-trace__list li { margin: 2px 0; }
    @media (max-width: 900px) {
      .chat-layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 220px); }
      .chat-container { min-height: calc(100vh - 340px); }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>dyagent</h1>
    </div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>聊天</h2>
    <div id="error-message" class="error-message"></div>
    <div class="agent-selector">
      <label for="agent-select">選擇代理者：</label>
      <select id="agent-select">
        <option value="">請選擇代理者</option>
      </select>
    </div>
    <div class="chat-layout">
      <aside class="sidebar">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <h3 style="margin:0;">聊天紀錄</h3>
          <button id="new-conv" class="btn btn-secondary" type="button">新對話</button>
        </div>
        <ul id="conv-list" class="conv-list"></ul>
        <div id="conv-empty" class="conv-meta" style="display:none; text-align:center; padding: 0.5rem;">尚無聊天紀錄</div>
      </aside>
      <section class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <p id="chat-initial-hint" style="text-align: center; color: var(--text-secondary);">請選擇代理者開始對話</p>
        </div>
        <details id="tools-panel" class="tools" style="margin-top:0.75rem;">
          <summary>可用工具</summary>
          <div id="tools-list" class="tools-list" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;"></div>
          <div class="tool-runner" style="display:flex;flex-direction:column;gap:6px;">
            <input id="tool-name" type="text" placeholder="例如 mcp:資料查詢 或 skillX" />
            <input id="tool-conv" type="text" placeholder="會話 ID（預設取最新）" />
            <div style="display:flex;gap:8px;align-items:center;">
              <button id="tool-tab-form" class="btn">表單</button>
              <button id="tool-tab-json" class="btn btn-secondary">JSON</button>
            </div>
            <div id="tool-form" style="display:block;"></div>
            <div id="tool-json" style="display:none;">
              <textarea id="tool-payload" rows="3" placeholder='JSON 參數，例如 {"q":"你好"}'></textarea>
            </div>
            <button id="run-tool" class="btn">執行工具</button>
            <button id="stream-tool" class="btn">串流執行（SSE）</button>
            <div id="tool-output" class="tool-output"></div>
          </div>
        </details>
        <form id="chat-form" class="chat-input">
          <input type="text" id="message-input" placeholder="輸入訊息..." disabled>
          <button type="submit" class="btn btn-primary" disabled>發送</button>
        </form>
      </section>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError } from '/main.js';

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    const currentUser = auth.getUser() || {};
    const autoRoutingMode = String(currentUser.role || '') === 'user';

    const agentSelect = document.getElementById('agent-select');
    const agentSelectorWrap = document.querySelector('.agent-selector');
    const chatMessages = document.getElementById('chat-messages');
    const chatInitialHint = document.getElementById('chat-initial-hint');
    const convList = document.getElementById('conv-list');
    const convEmpty = document.getElementById('conv-empty');
    const newConvBtn = document.getElementById('new-conv');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const submitBtn = chatForm.querySelector('button');
    const toolsList = document.getElementById('tools-list');
    const runToolBtn = document.getElementById('run-tool');
    const streamToolBtn = document.getElementById('stream-tool');
    const toolNameInput = document.getElementById('tool-name');
    const toolConvInput = document.getElementById('tool-conv');
    const toolPayloadInput = document.getElementById('tool-payload');
    const toolOutput = document.getElementById('tool-output');
    let toolHistory = [];
    let skillSchemas = {}; // skill name -> schema
    let mcpSchemas = {};   // 'mcp:<name>' -> schema
    // 追蹤目前串流中的工具卡片（需預先宣告，避免在 module 嚴格模式下 ReferenceError）
    let activeToolCard = null;

    // 簡易 tabs 切換（工具表單）
    (function(){
      const tF = document.getElementById('tool-tab-form');
      const tJ = document.getElementById('tool-tab-json');
      const bF = document.getElementById('tool-form');
      const bJ = document.getElementById('tool-json');
      function activate(which){
        if (which==='form'){
          bF.style.display='block'; bJ.style.display='none'; tF.classList.add('btn-secondary'); tJ.classList.remove('btn-secondary');
        } else {
          // 切到 JSON 分頁時，若表單有內容則自動帶入 JSON
          try {
            const tool = (document.getElementById('tool-name').value || '').trim();
            const hasForm = (document.getElementById('tool-form').style.display !== 'none');
            if (hasForm && tool) {
              const body = collectFormPayload('tool-form');
              const ta = document.getElementById('tool-payload');
              ta.value = JSON.stringify(body, null, 2);
            } else {
              // 若沒有 schema/表單，提供合理預設
              const ta = document.getElementById('tool-payload');
              if (!ta.value.trim()) {
                if (tool.startsWith('mcp:')) ta.value = '{"q": "查詢"}';
                else ta.value = '{}';
              }
            }
          } catch {}
          bF.style.display='none'; bJ.style.display='block'; tJ.classList.add('btn-secondary'); tF.classList.remove('btn-secondary');
        }
      }
      tF.addEventListener('click', ()=> {
        // 切到表單時，若 JSON 有內容則嘗試以 JSON 值重繪表單
        try{
          const tool = (document.getElementById('tool-name').value || '').trim();
          const schema = tool.startsWith('mcp:') ? (mcpSchemas[tool] || null) : (skillSchemas[tool] || null);
          if (schema){
            const raw = (document.getElementById('tool-payload').value || '').trim();
            if (raw){ const parsed = JSON.parse(raw); renderFormFromSchema('tool-form', schema, parsed); }
          }
        }catch{}
        activate('form');
      });
      tJ.addEventListener('click', ()=> activate('json'));
      activate('form');
    })();

    // Schema 渲染與收集（子集，同 skill-edit）
    function renderFormFromSchema(containerId, schema, initial){
      const root = document.getElementById(containerId);
      root.innerHTML = '';
      if (!schema || typeof schema !== 'object' || schema.type !== 'object' || !schema.properties){
        root.innerHTML = '<div class="muted">此技能未提供可渲染的表單結構；請改用 JSON 分頁。</div>';
        document.getElementById('tool-json').style.display='block';
        document.getElementById('tool-form').style.display='none';
        // 切成 JSON 分頁視圖（選中 JSON 應為灰底）
        const tF = document.getElementById('tool-tab-form'); const tJ = document.getElementById('tool-tab-json');
        tJ.classList.add('btn-secondary'); tF.classList.remove('btn-secondary');
        return;
      }
      const required = Array.isArray(schema.required) ? schema.required : [];
      Object.entries(schema.properties).forEach(([key, spec])=>{
        const row = document.createElement('div'); row.style.marginTop='6px';
        const lb = document.createElement('label'); const title = (spec && spec.title) ? spec.title : key; lb.textContent = title + (required.includes(key)? ' *': ''); lb.style.display='block'; lb.style.fontWeight='600'; row.appendChild(lb);
        const desc = (spec && spec.description) ? String(spec.description) : ''; if (desc){ const sm=document.createElement('div'); sm.className='muted'; sm.textContent=desc; sm.style.marginBottom='4px'; row.appendChild(sm); }
        // oneOf/anyOf（簡版）：若存在，產生選擇器後依選項渲染子 schema
        const variants = (spec && (spec.oneOf || spec.anyOf)) ? (spec.oneOf || spec.anyOf) : null;
        let t = (spec && spec.type) || 'string'; let inputEl=null;
        if (Array.isArray(variants) && variants.length){
          const sel = document.createElement('select'); sel.dataset.key = key; sel.style.marginBottom='4px';
          variants.forEach((v, i)=>{ const opt=document.createElement('option'); opt.value=String(i); opt.textContent = (v && v.title) ? v.title : `選項${i+1}`; sel.appendChild(opt); });
          row.appendChild(sel);
          const holder = document.createElement('div'); row.appendChild(holder);
          function renderVariant(idx){ holder.innerHTML=''; const v = variants[idx] || {}; const merged = Object.assign({}, spec, v); delete merged.oneOf; delete merged.anyOf; const fakeSchema = { type: 'object', properties: { [key]: merged }, required: required.includes(key)? [key]: [] };
            // 遞迴用本函式渲染僅此 key 的子表單
            const sub = document.createElement('div'); holder.appendChild(sub);
            const tmpId = containerId + '-' + key + '-variant'; sub.id = tmpId;
            renderFormFromSchema(tmpId, fakeSchema);
          }
          sel.addEventListener('change', ()=> renderVariant(parseInt(sel.value,10)||0));
          renderVariant(0);
          root.appendChild(row);
          return; // 交由子渲染
        }
        // format 對應輸入型別
        const fmt = spec && spec.format;
        if (spec && Array.isArray(spec.enum)){
          const sel=document.createElement('select'); sel.dataset.key=key; (spec.enum||[]).forEach(v=>{ const o=document.createElement('option'); o.value=String(v); o.textContent=String(v); sel.appendChild(o); }); if (spec.default!=null) sel.value=String(spec.default); inputEl=sel;
        } else if (t==='boolean'){
          const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.key=key; cb.checked=!!spec.default; inputEl=cb;
        } else if (t==='number' || t==='integer'){
          const num=document.createElement('input'); num.type='number'; num.dataset.key=key; if (typeof spec.minimum==='number') num.min=String(spec.minimum); if (typeof spec.maximum==='number') num.max=String(spec.maximum); if (spec.default!=null) num.value=String(spec.default); inputEl=num;
        } else if (t==='object' && spec.properties){
          const sub=document.createElement('div'); sub.dataset.key=key; sub.dataset.type='object'; sub.style.border='1px dashed var(--border-color)'; sub.style.padding='6px';
          Object.entries(spec.properties).forEach(([k2,s2])=>{ const r2=document.createElement('div'); r2.style.marginTop='6px'; const lb2=document.createElement('label'); lb2.textContent=(s2.title||k2); lb2.style.display='block'; lb2.style.fontWeight='600'; r2.appendChild(lb2); let el2; const t2=s2.type||'string'; if (Array.isArray(s2.enum)){ el2=document.createElement('select'); (s2.enum||[]).forEach(v=>{ const o=document.createElement('option'); o.value=String(v); o.textContent=String(v); el2.appendChild(o); }); if (s2.default!=null) el2.value=String(s2.default);} else if (t2==='boolean'){ el2=document.createElement('input'); el2.type='checkbox'; el2.checked=!!s2.default; } else if (t2==='number' || t2==='integer'){ el2=document.createElement('input'); el2.type='number'; if (typeof s2.minimum==='number') el2.min=String(s2.minimum); if (typeof s2.maximum==='number') el2.max=String(s2.maximum); if (s2.default!=null) el2.value=String(s2.default);} else { el2=document.createElement('input'); el2.type='text'; if (s2.default!=null) el2.value=String(s2.default);} el2.dataset.key=k2; r2.appendChild(el2); sub.appendChild(r2); }); inputEl=sub;
        } else if (t==='array'){
          const wrap=document.createElement('div'); wrap.dataset.key=key; wrap.dataset.type='array'; const list=document.createElement('div'); wrap.appendChild(list); const btn=document.createElement('button'); btn.type='button'; btn.className='btn'; btn.textContent='新增一列'; btn.style.marginTop='4px'; wrap.appendChild(btn);
          function addItem(def){ const item=document.createElement('div'); item.style.border='1px dashed var(--border-color)'; item.style.padding='6px'; item.style.marginTop='4px'; const rm=document.createElement('button'); rm.type='button'; rm.className='btn'; rm.textContent='移除'; rm.style.float='right'; rm.addEventListener('click', ()=> item.remove()); item.appendChild(rm); const it=spec.items||{}; if (it.type==='object' && it.properties){ Object.entries(it.properties).forEach(([k2,s2])=>{ const r2=document.createElement('div'); r2.style.marginTop='6px'; const lb2=document.createElement('label'); lb2.textContent=(s2.title||k2); lb2.style.display='block'; lb2.style.fontWeight='600'; r2.appendChild(lb2); let el2; const t2=s2.type||'string'; if (Array.isArray(s2.enum)){ el2=document.createElement('select'); (s2.enum||[]).forEach(v=>{ const o=document.createElement('option'); o.value=String(v); o.textContent=String(v); el2.appendChild(o); }); if (s2.default!=null) el2.value=String(s2.default);} else if (t2==='boolean'){ el2=document.createElement('input'); el2.type='checkbox'; el2.checked=!!s2.default; } else if (t2==='number' || t2==='integer'){ el2=document.createElement('input'); el2.type='number'; if (typeof s2.minimum==='number') el2.min=String(s2.minimum); if (typeof s2.maximum==='number') el2.max=String(s2.maximum); if (s2.default!=null) el2.value=String(s2.default);} else { el2=document.createElement('input'); el2.type='text'; if (s2.default!=null) el2.value=String(s2.default);} el2.dataset.key=k2; r2.appendChild(el2); item.appendChild(r2); }); } else { const el=document.createElement('input'); el.type='text'; el.dataset.key='__scalar__'; if (def!=null) el.value=String(def); item.appendChild(el);} list.appendChild(item); }
          btn.addEventListener('click', ()=> addItem(undefined)); if (Array.isArray(spec.default)) spec.default.forEach(v=> addItem(v)); inputEl=wrap;
        } else {
          const txt=document.createElement('input'); txt.type=(fmt==='email'?'email': (fmt==='uri'||fmt==='url')?'url': (fmt==='date'?'date': (fmt==='date-time'?'datetime-local':'text'))); txt.dataset.key=key; if (spec && spec.default!=null) txt.value=String(spec.default); if (spec && spec.pattern) txt.pattern=String(spec.pattern); inputEl=txt;
        }
        if (inputEl) row.appendChild(inputEl);
        root.appendChild(row);
      });
      // 若提供 initial，嘗試將 JSON 值灌入表單（包含建立陣列列與巢狀物件）
      try{ if (initial && typeof initial === 'object') fillFormWithInitial(containerId, initial, schema); }catch{}
    }
    function fillFormWithInitial(containerId, data, schema){
      const root=document.getElementById(containerId);
      const props = (schema && schema.properties) ? schema.properties : {};
      Object.keys(props).forEach((key)=>{
        const spec = props[key] || {};
        const val = data[key];
        if (val === undefined) return;
        // array
        if (spec.type === 'array'){
          const wrap = root.querySelector(`[data-type="array"][data-key="${key}"]`);
          if (!wrap || !Array.isArray(val)) return;
          const list = wrap.querySelector(':scope > div');
          const btn = wrap.querySelector('button.btn');
          const current = list ? list.querySelectorAll(':scope > div').length : 0;
          for (let i=current; i<val.length; i++){ btn && btn.click && btn.click(); }
          const items = list ? Array.from(list.querySelectorAll(':scope > div')) : [];
          items.forEach((it, i)=>{
            const cur = val[i];
            if (cur == null) return;
            // 物件元素
            const objInputs = it.querySelectorAll('[data-key]');
            if (objInputs && objInputs.length){
              objInputs.forEach(el=>{
                const k2 = el.getAttribute('data-key');
                if (!k2) return;
                const v2 = cur[k2];
                if (el.tagName==='SELECT') el.value = (v2!=null? String(v2): el.value);
                else if (el.type==='checkbox') el.checked = !!v2;
                else if (el.type==='number') el.value = (typeof v2==='number'? String(v2): el.value);
                else el.value = (v2!=null? String(v2): el.value);
              });
            } else {
              // 純量元素（__scalar__）
              const scalar = it.querySelector('[data-key="__scalar__"]');
              if (scalar) scalar.value = String(cur);
            }
          });
          return;
        }
        // object
        if (spec.type === 'object' && spec.properties){
          const sub = root.querySelector(`[data-type="object"][data-key="${key}"]`);
          if (!sub || typeof val !== 'object') return;
          Object.keys(spec.properties).forEach(k2=>{
            const el = sub.querySelector(`[data-key="${k2}"]`);
            if (!el) return;
            const v2 = val[k2];
            if (el.tagName==='SELECT') el.value = (v2!=null? String(v2): el.value);
            else if (el.type==='checkbox') el.checked = !!v2;
            else if (el.type==='number') el.value = (typeof v2==='number'? String(v2): el.value);
            else el.value = (v2!=null? String(v2): el.value);
          });
          return;
        }
        // 標量（string/number/boolean/enum）
        const el = root.querySelector(`[data-key="${key}"]`);
        if (!el) return;
        if (el.tagName==='SELECT') el.value = String(val);
        else if (el.type==='checkbox') el.checked = !!val;
        else if (el.type==='number') el.value = (typeof val==='number'? String(val): el.value);
        else el.value = String(val);
      });
    }
    function collectFormPayload(containerId){
      const root=document.getElementById(containerId); const payload={}; const rows=Array.from(root.children);
      for (const row of rows){
        const arrayBlock=row.querySelector('[data-type="array"]'); const objectBlock=row.querySelector('[data-type="object"]');
        if (arrayBlock){ const key=arrayBlock.dataset.key; const items=[]; arrayBlock.querySelectorAll(':scope > div > div').forEach(item=>{ const scalar=item.querySelector('input[data-key="__scalar__"]'); if (scalar) items.push(scalar.value); else { const obj={}; item.querySelectorAll('[data-key]').forEach(el=>{ const k=el.dataset.key; if (el.type==='checkbox') obj[k]=!!el.checked; else if (el.type==='number') obj[k]=Number(el.value||0); else obj[k]=el.value; }); items.push(obj);} }); payload[key]=items; continue; }
        if (objectBlock){ const key=objectBlock.dataset.key; const obj={}; objectBlock.querySelectorAll('[data-key]').forEach(el=>{ const k=el.dataset.key; if (el.type==='checkbox') obj[k]=!!el.checked; else if (el.type==='number') obj[k]=Number(el.value||0); else obj[k]=el.value; }); payload[key]=obj; continue; }
        const inp=row.querySelector('[data-key]'); if (!inp) continue; const key=inp.dataset.key; if (inp.tagName==='SELECT') payload[key]=inp.value; else if (inp.type==='checkbox') payload[key]=!!inp.checked; else if (inp.type==='number') payload[key]=(inp.value.trim()===''? null : Number(inp.value)); else payload[key]=inp.value;
      }
      return payload;
    }

    // 輔助：建立工具卡片（標題、狀態、內容、操作）

      titleText.innerHTML = `<strong>工具：</strong>${name}`;

      const status = document.createElement('span');
      status.className = 'tool-card__status';

      status.style.color = 'var(--text-secondary)';

      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '6px';
      const collapseBtn = document.createElement('button');
      collapseBtn.className = 'btn';
      collapseBtn.textContent = '收合';
      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn';
      clearBtn.textContent = '清除內容';
      const rerunBtn = document.createElement('button');
      rerunBtn.className = 'btn';
      rerunBtn.textContent = '重執行';
      const rerunStreamBtn = document.createElement('button');
      rerunStreamBtn.className = 'btn';
      rerunStreamBtn.textContent = '串流重執行';

      actions.appendChild(collapseBtn);
      actions.appendChild(clearBtn);
      actions.appendChild(rerunBtn);
      actions.appendChild(rerunStreamBtn);

      header.appendChild(title);
      header.appendChild(status);
      header.appendChild(actions);

      const body = document.createElement('div');
      body.className = 'tool-card__body';
      body.style.marginTop = '6px';
      body.style.maxHeight = '240px';
      body.style.overflow = 'auto';
      body.style.background = 'var(--card-bg)';
      body.style.border = '1px dashed var(--border-color)';
      body.style.padding = '6px';

      collapseBtn.addEventListener('click', () => {
        const visible = body.style.display !== 'none';
        body.style.display = visible ? 'none' : 'block';
        collapseBtn.textContent = visible ? '展開' : '收合';
      });
      clearBtn.addEventListener('click', () => {
        body.innerHTML = '';
      });

      const alert = document.createElement('div');
      alert.className = 'tool-alert';

      const prog = document.createElement('div');
      prog.className = 'tool-progress';
      const bar = document.createElement('div');
      bar.className = 'tool-progress__bar';
      prog.appendChild(bar);
      const progMeta = document.createElement('div');
      progMeta.className = 'tool-progress__meta';
      progMeta.textContent = '0%';

      card.appendChild(header);
      card.appendChild(alert);
      card.appendChild(prog);
      card.appendChild(progMeta);
      card.appendChild(body);
      const meta = { card, body, status, badge, alert, prog, bar, progMeta, _state: 'running', _progress: 0, _t0: Date.now(), _lastTs: null, _lastProg: 0, _toolName: '', _lastPayload: {}, _convId: '' };
      // 綁定重執行動作
      rerunBtn.addEventListener('click', async () => {
        try {
          const tool = meta._toolName || (titleText.textContent || '').replace('工具：','').trim();
          const convId = meta._convId || (document.getElementById('tool-conv')?.value || '');
          const args = meta._lastPayload || {};
          if (!tool || !convId) return;
          setCardStatus(meta, 'running');
          const res = await api.post(`/conversations/${convId}/tools/${encodeURIComponent(tool)}`, args);
          appendFrame(meta.body, res);
          if (res && res.ok) setCardStatus(meta, 'ok'); else setCardStatus(meta, 'error', (res && res.error) || '執行失敗');
        } catch (e) {
          appendFrame(meta.body, { ok: false, error: e.message || '重執行失敗' });
          setCardStatus(meta, 'error', e.message || '重執行失敗');
        }
      });
      rerunStreamBtn.addEventListener('click', async () => {
        try {
          const tool = meta._toolName || (titleText.textContent || '').replace('工具：','').trim();
          const convId = meta._convId || (document.getElementById('tool-conv')?.value || '');
          if (!tool || !convId) return;
          setCardStatus(meta, 'running');
          const token = localStorage.getItem('auth_token');
          const resp = await fetch(`/api/conversations/${convId}/tools/${encodeURIComponent(tool)}/stream`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}` },
          });
          if (!resp.ok || !resp.body) {
            appendFrame(meta.body, { ok: false, error: `串流建立失敗：HTTP ${resp.status}` });
            setCardStatus(meta, 'error', `串流建立失敗：HTTP ${resp.status}`);
            return;
          }
          const reader = resp.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf('\n\n')) >= 0) {
              const chunk = buffer.slice(0, idx);
              buffer = buffer.slice(idx + 2);
              if (!chunk.startsWith('data: ')) continue;
              try {
                const payload = JSON.parse(chunk.replace(/^data:\s*/, ''));
                if (payload.type === 'progress') {
                  updateProgress(meta, payload.value, payload.eta_seconds);
                } else if (payload.type === 'tool') {
                  appendFrame(meta.body, payload.frame);
                  if (payload.frame && payload.frame.ok === false) setCardStatus(meta, 'error', payload.frame.error || '執行失敗');
                  else if (payload.frame && payload.frame.ok === true) setCardStatus(meta, 'ok');
                } else if (payload.type === 'heartbeat') {
                  // 保持連線活性提示
                  if (meta && meta.progMeta && meta._state === 'running') {
                    const pct = typeof meta._progress === 'number' ? meta._progress : 0;
                    meta.progMeta.textContent = pct + '% · 仍在處理…';
                  }
                } else if (payload.type === 'done') {
                  if (meta._state === 'running') setCardStatus(meta, 'ok');
                }
              } catch {}
            }
          }
        } catch (e) {
          appendFrame(meta.body, { ok: false, error: e.message || '串流重執行失敗' });
          setCardStatus(meta, 'error', e.message || '串流重執行失敗');
        }
      });
      return meta;
    }

    function appendFrame(container, frame) {
      const row = document.createElement('div');
      row.style.borderTop = '1px solid var(--border-subtle, #e5e5e5)';
      row.style.paddingTop = '6px';
      row.style.marginTop = '6px';

      const meta = document.createElement('div');
      meta.style.display = 'flex';
      meta.style.alignItems = 'center';
      meta.style.justifyContent = 'space-between';
      const ts = new Date().toLocaleTimeString();
      meta.innerHTML = `<span style="color:var(--text-secondary)">${ts}</span>`;

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn';
      copyBtn.textContent = '複製 JSON';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(JSON.stringify(frame, null, 2));
          copyBtn.textContent = '已複製';
          setTimeout(() => (copyBtn.textContent = '複製 JSON'), 1500);
        } catch {}
      });
      meta.appendChild(copyBtn);

      const pre = document.createElement('pre');
      pre.className = 'code json';
      pre.style.whiteSpace = 'pre-wrap';
      pre.innerHTML = syntaxHighlight(JSON.stringify(frame, null, 2));

      row.appendChild(meta);
      row.appendChild(pre);
      container.appendChild(row);
    }

    function setCardStatus(meta, state, msg) {
      // state: 'running' | 'ok' | 'error'
      meta._state = state;
      meta.badge.classList.remove('running', 'ok', 'error');
      if (state === 'ok') {
        meta.badge.classList.add('ok');
        meta.status.textContent = '完成';
        meta.status.style.color = 'var(--ok-color, #198754)';
        meta.alert.style.display = 'none';
        updateProgress(meta, 100, 0);
        meta.prog.style.display = 'none';
        meta.progMeta.style.display = 'none';
      } else if (state === 'error') {
        meta.badge.classList.add('error');
        meta.status.textContent = '失敗';
        meta.status.style.color = 'var(--error-color, #c0392b)';
        if (msg) {
          meta.alert.textContent = String(msg);
          meta.alert.style.display = 'block';
        }
        meta.prog.style.display = 'none';
        meta.progMeta.style.display = 'none';
      } else {
        meta.badge.classList.add('running');
        meta.status.textContent = '執行中…';
        meta.status.style.color = 'var(--text-secondary)';
        meta.alert.style.display = 'none';
        meta.prog.style.display = 'block';
        meta.progMeta.style.display = 'block';
      }
    }

    function updateProgress(meta, value, etaSeconds) {
      if (!meta || !meta.bar) return;
      let v = Number(value);
      if (Number.isNaN(v)) return;
      v = Math.max(0, Math.min(100, Math.round(v)));
      meta._progress = v;
      meta.bar.style.width = v + '%';
      // 色彩從紅(0)到綠(120)之間漸變
      const hue = Math.round((v / 100) * 120);
      meta.bar.style.backgroundColor = `hsl(${hue}, 70%, 50%)`;
      // 估算/顯示剩餘時間
      let etaText = '';
      if (typeof etaSeconds === 'number' && isFinite(etaSeconds) && etaSeconds >= 0) {
        etaText = ` · ${formatSeconds(etaSeconds)} 剩餘`;
      } else {
        const now = Date.now();
        if (meta._lastTs != null && v > meta._lastProg) {
          const dp = v - meta._lastProg;
          const dt = (now - meta._lastTs) / 1000; // s
          const speed = dp / dt; // % per s
          if (speed > 0 && v < 100) {
            const remain = (100 - v) / speed; // s
            if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
          }
        } else if (v > 0) {
          const elapsed = (now - (meta._t0 || now)) / 1000; // s
          const remain = elapsed * (100 - v) / v;
          if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
        }
        meta._lastTs = now;
        meta._lastProg = v;
      }
      if (meta.progMeta) meta.progMeta.textContent = v + '%' + etaText;
      if (v >= 100 && meta._state === 'running') {
        // 自動標記完成
        setCardStatus(meta, 'ok');
      }
    }

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function createReactTraceCard() {
      const wrap = document.createElement('div');

    function appendReactTrace(traceMeta, payload) {
      if (!traceMeta || !traceMeta.list || !payload) return;
      const li = document.createElement('li');

      li.textContent = `${step}${msg}`;
      if (phase === 'act_result' && payload.ok === false) {

    let currentAgentId = null;
    let currentConversationId = null;
    let currentConversations = [];
    let agentRegistry = [];

    async function loadAgents() {
      try {
        // 先嘗試 public 清單（所有登入者可見）
        let response = await api.get('/agents/public');
        let agents = Array.isArray(response.agents) ? response.agents : [];
        agentRegistry = agents;
        // 若為 admin 且 public 為空，回退 /agents（需要 read_agent）
        try {
          const me = JSON.parse(localStorage.getItem('user') || 'null');
          if (me && me.role === 'admin' && agents.length === 0) {
            const resp2 = await api.get('/agents');
            agents = Array.isArray(resp2.agents) ? resp2.agents : agents;
          }
        } catch {}
        agentSelect.innerHTML = '<option value="">請選擇代理者</option>';
        if (agents.length === 0) {
          // 顯示提示：無代理者可選
          const hint = document.createElement('div');
          hint.className = 'conv-meta';
          hint.style.margin = '8px 0';
          hint.textContent = '目前沒有可選擇的代理者，請聯絡管理者建立。';
          const nav = document.querySelector('.nav-menu');
          const me = JSON.parse(localStorage.getItem('user') || 'null');
          if (me && me.role === 'admin') {
            const link = document.createElement('a');
            link.href = '/pages/create-agent.html';
            link.className = 'btn';
            link.style.marginLeft = '8px';
            link.textContent = '建立代理者';
            hint.appendChild(link);
            // 管理者：自動導向建立代理者精靈，降低空白狀態的迷惑
            setTimeout(() => {
              // 避免重複導向：若下拉已有資料（期間有新代理者建立）則不跳轉
              if (![...agentSelect.options].some(o => o.value)) {
                window.location.href = '/pages/create-agent.html';
              }
            }, 1200);
          }
          // 將提示插到 agentSelect 之後
          agentSelect.parentElement.appendChild(hint);
        } else {
          agents.forEach(agent => {
            const option = document.createElement('option');
            option.value = agent.id;
            option.textContent = agent.is_router ? `${agent.name}（主代理）` : agent.name;
            agentSelect.appendChild(option);
          });
        }

        if (autoRoutingMode && agentSelectorWrap) {
          agentSelectorWrap.style.display = 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const agentParam = urlParams.get('agent');
        const lastAgent = localStorage.getItem('last_agent_id');
        if (autoRoutingMode) {
          const router = (agents || []).find((a) => !!a.is_router);
          const initial = (router && router.id) ? router.id : ((agents[0] && agents[0].id) || '');
          if (initial) {
            currentAgentId = initial;
            await selectAgent(initial);
          } else {
            chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">目前沒有可用代理者，請聯絡管理者。</p>';
          }
        } else {
          const initial = agentParam || lastAgent;
          if (initial && [...agentSelect.options].some(o => o.value === initial)) {
            agentSelect.value = initial;
            selectAgent(initial);
          }
        }
      } catch (error) {
        showError(error.message);
      }
    }

    async function selectAgent(agentId) {
      currentAgentId = agentId;
      messageInput.disabled = false;
      submitBtn.disabled = false;
      localStorage.setItem('last_agent_id', agentId);

      try {
        // 側欄載入中狀態
        convEmpty.style.display = 'none';
        convList.innerHTML = '<li class="conv-item"><div class="conv-meta">載入中…</div></li>';
        const response = await api.get(`/agents/${agentId}/conversations`);
        currentConversations = Array.isArray(response.conversations) ? response.conversations : [];
        renderSidebar(currentConversations);
        if (currentConversations.length > 0) {
          // 預設載入最新一筆
          currentConversationId = currentConversations[0].id;
          // 訊息面板載入中
          chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">載入中…</p>';
          renderMessagesById(currentConversationId);
        } else {
          chatMessages.innerHTML = '<p style="text-align: center;">可以開始對話了</p>';
        }
        // 載入此代理者可用工具清單
        try {
          const integ = await api.get(`/agents/${agentId}/integrations`);
          const skills = Array.isArray(integ.skills) ? integ.skills : [];
          const mcps = Array.isArray(integ.mcp_config) ? integ.mcp_config : [];
          const items = [];
          skills.forEach(s => items.push({ name: s, type: 'skill' }));
          mcps.filter(c => c && c.enabled).forEach(c => items.push({ name: `mcp:${c.name}`, type: 'mcp' }));
          // 直接使用 integrations 回傳的 schema（無需 /skills 權限）
          skillSchemas = (integ && typeof integ.skill_schemas === 'object') ? integ.skill_schemas : {};
          mcpSchemas = (integ && typeof integ.mcp_schemas === 'object') ? integ.mcp_schemas : {};
          if (items.length) {
            toolsList.innerHTML = '';
            items.forEach(x => {
              const el = document.createElement('span');
              el.className = 'tag';
              el.textContent = x.name;
              el.style.cursor = 'pointer';
              el.title = '點擊帶入工具名稱';
              el.addEventListener('click', () => {
                toolNameInput.value = x.name;
                // 若為 skill 且有 schema，切換到表單並渲染；否則切 JSON 並給預設模板
                if (!x.name.startsWith('mcp:') && skillSchemas[x.name]) {
                  document.getElementById('tool-form').style.display='block'; document.getElementById('tool-json').style.display='none';
                  document.getElementById('tool-tab-form').classList.add('btn-secondary'); document.getElementById('tool-tab-json').classList.remove('btn-secondary');
                  let init=null; try{ const raw=toolPayloadInput.value.trim(); if (raw) init=JSON.parse(raw);}catch{}
                  renderFormFromSchema('tool-form', skillSchemas[x.name], init);
                } else if (x.name.startsWith('mcp:') && mcpSchemas[x.name]) {
                  document.getElementById('tool-form').style.display='block'; document.getElementById('tool-json').style.display='none';
                  document.getElementById('tool-tab-form').classList.add('btn-secondary'); document.getElementById('tool-tab-json').classList.remove('btn-secondary');
                  let init=null; try{ const raw=toolPayloadInput.value.trim(); if (raw) init=JSON.parse(raw);}catch{}
                  renderFormFromSchema('tool-form', mcpSchemas[x.name], init);
                } else {
                  document.getElementById('tool-form').style.display='none'; document.getElementById('tool-json').style.display='block';
                  document.getElementById('tool-tab-json').classList.add('btn-secondary'); document.getElementById('tool-tab-form').classList.remove('btn-secondary');
                  toolPayloadInput.value = x.type === 'mcp' ? '{"q": "查詢"}' : '{}';
                }
              });
              toolsList.appendChild(el);
            });
          } else {
            toolsList.innerHTML = '<div class="muted">（此代理者未啟用任何工具）</div>';
          }
          toolConvInput.value = currentConversationId || '';
        } catch {}
        // 不在前端進行 LLM 暖機，避免主代理或未配置模型造成噪音錯誤
      } catch (error) {
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--error-color);">載入失敗，請稍後再試</p>';
      }
    }

    function snippetTitle(conv) {
      if (conv.title && conv.title.trim()) return conv.title;
      const firstUser = (conv.messages || []).find(m => m.role === 'user');
      const text = firstUser ? (firstUser.content || '') : '';
      return text.length > 20 ? text.slice(0, 20) + '…' : (text || '新對話');
    }

    function closeAllConversationMenus() {
      document.querySelectorAll('.conv-menu.open').forEach((el) => el.classList.remove('open'));
    }

    function renderSidebar(conversations) {
      convList.innerHTML = '';
      if (!conversations || conversations.length === 0) {
        convEmpty.style.display = 'block';
        return;
      }
      convEmpty.style.display = 'none';
      conversations.forEach((c) => {
        const li = document.createElement('li');
        li.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
        li.dataset.id = c.id;
        const title = snippetTitle(c);
        const meta = c.last_interacted_at ? new Date(c.last_interacted_at).toLocaleString() : '';
        li.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
            <div class="conv-title" style="flex:1;">${title}</div>
            <div class="conv-actions">
              <button class="btn conv-menu-trigger" data-action="menu" title="操作選單">⋯</button>
              <div class="conv-menu" data-menu>
                <button type="button" data-action="rename">更名</button>
                <button type="button" class="danger" data-action="delete">刪除</button>
              </div>
            </div>
          </div>
          <div class="conv-meta">${meta}</div>
        `;
        li.addEventListener('click', (ev) => {
          if (ev.target && ev.target.closest && ev.target.closest('.conv-actions')) return;
          currentConversationId = c.id;
          renderMessagesById(c.id);
          Array.from(convList.children).forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          closeAllConversationMenus();
        });

        const menuBtn = li.querySelector('[data-action="menu"]');
        const menuBox = li.querySelector('[data-menu]');
        menuBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const willOpen = !menuBox.classList.contains('open');
          closeAllConversationMenus();
          if (willOpen) menuBox.classList.add('open');
        });

        li.querySelector('[data-action="rename"]').addEventListener('click', async (ev) => {
          ev.stopPropagation();
          closeAllConversationMenus();
          const newTitle = window.prompt('輸入新的會話標題（最多 200 字）', snippetTitle(c));
          if (!newTitle || !newTitle.trim()) return;
          try {
            const res = await api.put(`/conversations/${c.id}/title`, { title: newTitle.trim() });
            if (res && res.ok) {
              c.title = newTitle.trim();
              renderSidebar(conversations);
            }
          } catch (e) {
            showError(e.message || '重新命名失敗');
          }
        });

        li.querySelector('[data-action="delete"]').addEventListener('click', async (ev) => {
          ev.stopPropagation();
          closeAllConversationMenus();
          const ok = window.confirm('確定要刪除此聊天紀錄嗎？此操作無法復原。');
          if (!ok) return;
          try {
            const res = await api.delete(`/conversations/${c.id}`);
            if (res && res.ok) {
              currentConversations = (currentConversations || []).filter((x) => x.id !== c.id);
              if (currentConversationId === c.id) {
                currentConversationId = (currentConversations[0] && currentConversations[0].id) || null;
              }
              renderSidebar(currentConversations);
              if (currentConversationId) {
                renderMessagesById(currentConversationId);
              } else {
                chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">可以開始對話了</p>';
              }
            }
          } catch (e) {
            showError((e && e.message) || '刪除失敗');
          }
        });
        convList.appendChild(li);
      });
    }

    document.addEventListener('click', () => {
      closeAllConversationMenus();
    });

    function renderMessagesById(convId) {
      const conv = (currentConversations || []).find(c => c.id === convId);
      if (!conv) return;
      chatMessages.innerHTML = (conv.messages || []).map(msg => `
        <div class="message ${msg.role}">
          <p>${msg.content}</p>
          <small style="opacity: 0.7;">${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</small>
        </div>
      `).join('');
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // 載入並渲染此對話的工具事件（持久化卡片）
      (async () => {
        try {
          const ev = await api.get(`/conversations/${convId}/events?types=tool_input,tool_result,tool_error`);
          const list = Array.isArray(ev.events) ? ev.events : [];
          list.forEach(e => {
            if (!e || !e.type) return;
            // 僅將 result/error 呈現為卡片；input 可作為後續擴充
            if (e.type === 'tool_result' || e.type === 'tool_error') {
              const name = (e.payload && e.payload.tool) ? e.payload.tool : 'tool';
              const meta = createToolCard(name);
              // result: 目前 payload 為 { tool, keys: [...] } 或完整 frame（若可用）
              // error: { tool, error }
              if (e.type === 'tool_error') {
                setCardStatus(meta, 'error', (e.payload && e.payload.error) || '執行失敗');
                appendFrame(meta.body, e.payload || {});
              } else {
                setCardStatus(meta, 'ok');
                appendFrame(meta.body, e.payload || {});
              }
              const holder = document.createElement('div');
              holder.appendChild(meta.card);
              chatMessages.appendChild(holder);
            }
          });
        } catch {}
      })();
    }

    // 安全轉義與簡易 JSON 語法高亮
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function syntaxHighlight(jsonText) {
      // 先整體轉義，確保安全
      let html = escapeHTML(jsonText);
      // 字串（含可能的鍵），先標記，再將作為鍵的字串（後接冒號）改為 key 樣式
      html = html.replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?/g, (match, group1, isKey) => {
        if (isKey) {
          return '<span class="json-key">' + group1 + '</span>:';
        }
        return '<span class="json-string">' + group1 + '</span>';
      });
      // 數字
      html = html.replace(/\b-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+\-]?\d+)?\b/g, (m) => '<span class="json-number">' + m + '</span>');
      // 布林與 null
      html = html.replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>');
      html = html.replace(/\bnull\b/g, '<span class="json-null">null</span>');
      return html;
    }

    agentSelect.addEventListener('change', (e) => {
      if (autoRoutingMode) return;
      if (e.target.value) {
        selectAgent(e.target.value);
      } else {
        currentAgentId = null;
        messageInput.disabled = true;
        submitBtn.disabled = true;
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">請選擇代理者開始對話</p>';
      }
    });

    runToolBtn.addEventListener('click', async () => {
      try {
        const tool = (toolNameInput.value || '').trim();
        if (!tool) { toolOutput.textContent = '請輸入工具名稱'; return; }
        let convId = (toolConvInput.value || '').trim();
        if (!convId) convId = currentConversationId || '';
        if (!convId) { toolOutput.textContent = '請先建立或選擇會話'; return; }
        let body = {};
        if (document.getElementById('tool-json').style.display !== 'none') {
          if (toolPayloadInput.value.trim()) { try { body = JSON.parse(toolPayloadInput.value); } catch { toolOutput.textContent = 'JSON 參數格式錯誤'; return; } }
        } else {
          try { body = collectFormPayload('tool-form'); } catch(e){ toolOutput.textContent = e && e.message ? e.message : '表單驗證失敗'; return; }
          // 基本前端驗證（若有 schema）
          try {
            const tool = (toolNameInput.value || '').trim();
            const schema = tool.startsWith('mcp:') ? (mcpSchemas[tool] || null) : (skillSchemas[tool] || null);
            if (schema && schema.type === 'object'){
              // 簡化驗證：僅檢查 required/type/界線/長度/正則
              const root = document.getElementById('tool-form'); root.querySelectorAll('.field-error').forEach(n=>n.remove()); root.querySelectorAll('input,select,textarea').forEach(el=> el.style.borderColor='');
              const req = Array.isArray(schema.required)? schema.required: []; const props = schema.properties||{}; let bad=false;
              Object.entries(props).forEach(([k, spec])=>{
                const el = root.querySelector(`[data-key="${k}"]`) || root.querySelector(`[data-type] [data-key="${k}"]`);
                const v = body[k]; const t=(spec && spec.type)||'string';
                function addErr(msg){ if (!el) return; const d=document.createElement('div'); d.className='field-error'; d.style.color='var(--danger-color,#c0392b)'; d.style.fontSize='12px'; d.style.marginTop='2px'; d.textContent=String(msg); el.style.borderColor='var(--danger-color,#c0392b)'; el.insertAdjacentElement('afterend', d); bad=true; }
                if (req.includes(k) && (v===undefined||v===null||v==='')) addErr('必填');
                if (v===undefined||v===null||v==='') return;
                if (t==='number' || t==='integer'){
                  if (typeof v !== 'number' || Number.isNaN(v)) addErr('需為數字');
                  if (spec && typeof spec.minimum==='number' && v < spec.minimum) addErr(`不可小於 ${spec.minimum}`);
                  if (spec && typeof spec.maximum==='number' && v > spec.maximum) addErr(`不可大於 ${spec.maximum}`);
                } else if (t==='string'){
                  if (typeof v !== 'string') addErr('需為字串');
                  if (spec && typeof spec.minLength==='number' && v.length < spec.minLength) addErr(`長度不可小於 ${spec.minLength}`);
                  if (spec && typeof spec.maxLength==='number' && v.length > spec.maxLength) addErr(`長度不可大於 ${spec.maxLength}`);
                  if (spec && spec.pattern){ try { const re=new RegExp(spec.pattern); if (!re.test(v)) addErr('格式不符合規則'); } catch {} }
                }
              });
              if (bad) { toolOutput.textContent = '表單欄位有誤，請修正紅框標示'; return; }
            }
          } catch {}
        }
        const holder = document.createElement('div');
        const meta = createToolCard(tool);
        meta._toolName = tool;
        meta._lastPayload = body;
        meta._convId = convId;
        holder.appendChild(meta.card);
        toolOutput.prepend(holder);
        const res = await api.post(`/conversations/${convId}/tools/${encodeURIComponent(tool)}`, body);
        appendFrame(meta.body, res);
        if (res && res.ok) setCardStatus(meta, 'ok'); else {
          setCardStatus(meta, 'error', (res && res.error) || '執行失敗');
          // 若有欄位級錯誤，標示於表單
          if (Array.isArray(res && res.errors) && document.getElementById('tool-form').style.display !== 'none'){
            const root = document.getElementById('tool-form');
            root.querySelectorAll('.field-error').forEach(n=>n.remove()); root.querySelectorAll('input,select,textarea').forEach(el=> el.style.borderColor='');
            res.errors.forEach(e=>{
              const p = (e && e.path) ? String(e.path) : ''; const key = p.split('.')[0]; if (!key) return;
              const el = root.querySelector(`[data-key="${key}"]`) || root.querySelector(`[data-type] [data-key="${key}"]`);
              if (el) { const d=document.createElement('div'); d.className='field-error'; d.style.color='var(--danger-color,#c0392b)'; d.style.fontSize='12px'; d.style.marginTop='2px'; d.textContent= (e && e.message) ? String(e.message) : '不符合結構'; el.style.borderColor='var(--danger-color,#c0392b)'; el.insertAdjacentElement('afterend', d); }
            });
          }
        }
        toolHistory.unshift({ t: new Date().toISOString(), tool, convId, body, res });
      } catch (e) {
        const holder = document.createElement('div');
        const meta = createToolCard((toolNameInput.value || '').trim() || 'tool');
        holder.appendChild(meta.card);
        toolOutput.prepend(holder);
        appendFrame(meta.body, { ok: false, error: e.message || '執行工具失敗' });
        setCardStatus(meta, 'error', e.message || '執行工具失敗');
      }
    });

    streamToolBtn.addEventListener('click', async () => {
      try {
        const tool = (toolNameInput.value || '').trim();
        if (!tool) { toolOutput.textContent = '請輸入工具名稱'; return; }
        let convId = (toolConvInput.value || '').trim();
        if (!convId) convId = currentConversationId || '';
        if (!convId) { toolOutput.textContent = '請先建立或選擇會話'; return; }
        const holder = document.createElement('div');
        const meta = createToolCard(tool);
        meta._toolName = tool;
        meta._convId = convId;
        holder.appendChild(meta.card);
        toolOutput.prepend(holder);
        const token = localStorage.getItem('auth_token');
        // 以 fetch 串流方式讀取 SSE（因 EventSource 無法帶自訂標頭）
        const resp = await fetch(`/api/conversations/${convId}/tools/${encodeURIComponent(tool)}/stream`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (!resp.ok || !resp.body) {
          appendFrame(meta.body, { ok: false, error: `串流建立失敗：HTTP ${resp.status}` });
          setCardStatus(meta, 'error', `串流建立失敗：HTTP ${resp.status}`);
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (chunk.startsWith('data: ')) {
              try {
                const jsonStr = chunk.replace(/^data:\s*/, '');
                const obj = JSON.parse(jsonStr);
                if (obj && obj.type === 'progress') {
                  updateProgress(meta, obj.value, obj.eta_seconds);
                } else if (obj && obj.type === 'heartbeat') {
                  if (meta && meta.progMeta && meta._state === 'running') {
                    const pct = typeof meta._progress === 'number' ? meta._progress : 0;
                    meta.progMeta.textContent = pct + '% · 仍在處理…';
                  }
                } else if (obj && obj.type === 'tool') {
                  appendFrame(meta.body, obj.frame);
                  if (obj.frame && obj.frame.ok === false) setCardStatus(meta, 'error', obj.frame.error || '執行失敗');
                  else if (obj.frame && obj.frame.ok === true) setCardStatus(meta, 'ok');
                  // 嘗試讀取進度欄位（progress/percent/value）
                  const f = obj.frame || {};
                  const cand = (typeof f.progress === 'number' ? f.progress
                    : (typeof f.percent === 'number' ? f.percent
                    : (typeof f.value === 'number' ? f.value : null)));
                  const eta = (typeof f.eta_seconds === 'number' ? f.eta_seconds
                    : (typeof f.eta === 'number' ? f.eta
                    : (typeof f.remaining_ms === 'number' ? f.remaining_ms / 1000 : null)));
                  if (cand !== null) updateProgress(meta, cand, eta);
                } else if (obj && obj.type === 'done') {
                  if (meta._state === 'running') setCardStatus(meta, 'ok');
                }
              } catch {}
            }
          }
        }
      } catch (e) {
        const holder = document.createElement('div');
        const meta = createToolCard((toolNameInput.value || '').trim() || 'tool');
        holder.appendChild(meta.card);
        toolOutput.prepend(holder);
        appendFrame(meta.body, { ok: false, error: e.message || '串流執行錯誤' });
        setCardStatus(meta, 'error', e.message || '串流執行錯誤');
      }
    });

    newConvBtn.addEventListener('click', async () => {
      if (!currentAgentId) {
        showError(autoRoutingMode ? '目前尚未取得可用代理者，請先送出一則訊息或聯絡管理者' : '請先選擇代理者');
        return;
      }
      try {
        const res = await api.post(`/agents/${currentAgentId}/conversations`, {});
        if (res && res.id) {
          // 將新會話插入最前面
          const conv = {
            id: res.id,
            agent_id: res.agent_id,
            title: res.title || '',
            messages: [],
            created_at: res.created_at,
            last_interacted_at: res.last_interacted_at,
          };
          currentConversations = [conv, ...(currentConversations || [])];
          currentConversationId = conv.id;
          renderSidebar(currentConversations);
          renderMessagesById(currentConversationId);
          messageInput.focus();
        }
      } catch (e) {
        showError(e.message || '新對話建立失敗');
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = (messageInput.value || '').trim();
      if (!msg || !currentAgentId) return;
      const STREAM_TIMEOUT_MS = 120000;
      messageInput.disabled = true;
      submitBtn.disabled = true;
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<p>${msg}</p>`;
      chatMessages.appendChild(userMsg);
      // 建立助理訊息區塊
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      const routeInfo = document.createElement('div');
      routeInfo.style.fontSize = '12px';
      routeInfo.style.color = 'var(--text-secondary)';
      routeInfo.style.marginBottom = '6px';
      routeInfo.textContent = '本輪由：主代理分派中...';
      const p = document.createElement('p');
      assistantMsg.appendChild(routeInfo);
      assistantMsg.appendChild(p);
      const reactTrace = createReactTraceCard();
      assistantMsg.appendChild(reactTrace.wrap);
      chatMessages.appendChild(assistantMsg);
      // 串流聊天
      try {
        const token = localStorage.getItem('auth_token');
        const selected = (agentRegistry || []).find((a) => String(a.id) === String(currentAgentId));
        const useUnifiedEntry = !!autoRoutingMode || !!(selected && selected.is_router);
        const url = useUnifiedEntry
          ? '/api/chat'
          : (`/api/agents/${currentAgentId}/chat/stream?` + new URLSearchParams({ message: msg }));
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort('timeout'), STREAM_TIMEOUT_MS);
        let resp = await fetch(url, {
          method: useUnifiedEntry ? 'POST' : 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
          },
          body: useUnifiedEntry ? JSON.stringify({ message: msg }) : undefined,
          signal: controller.signal,
        });
        if (!resp.ok && resp.status === 503) {
          // 後端重啟或模型路由短暫不可用時，做一次短暫重試
          await new Promise((r) => setTimeout(r, 1200));
          resp = await fetch(url, {
            method: useUnifiedEntry ? 'POST' : 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
            },
            body: useUnifiedEntry ? JSON.stringify({ message: msg }) : undefined,
            signal: controller.signal,
          });
        }
        if (!resp.ok || !resp.body) {
          clearTimeout(timer);
          p.textContent = `串流失敗：HTTP ${resp.status}`;
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!chunk.startsWith('data: ')) continue;
            try {
              const payload = JSON.parse(chunk.replace(/^data:\s*/, ''));
              if (payload.type === 'text' && typeof payload.delta === 'string') {
                p.textContent += payload.delta;
                // 避免把內部工具協議 [[CALL ...]] 顯示給使用者
                p.textContent = p.textContent.replace(/\[\[CALL tool=[^\]]+\]\]\s*(\{[\s\S]*?\})?/g, '').trimStart();
                p.textContent = p.textContent.replace(/```json\s*\{[\s\S]*?\}\s*```/gi, '').trimStart();
                p.textContent = p.textContent.replace(/\{\s*"tool_calls"\s*:\s*\[[\s\S]*?\]\s*\}/g, '').trimStart();
              } else if (payload.type === 'react') {
                appendReactTrace(reactTrace, payload);
              } else if (payload.type === 'route.decision') {
                if (payload.target_agent_name) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_name)} 代理者回覆`;
                } else if (payload.target_agent_id) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_id)} 代理者回覆`;
                }
                if (payload.target_agent_id) {
                  currentAgentId = String(payload.target_agent_id);
                  if (!autoRoutingMode) {
                    try { agentSelect.value = String(payload.target_agent_id); } catch {}
                  }
                }
              } else if (payload.type === 'tool_start') {
                const built = createToolCard(payload.name);
                built._toolName = payload.name;
                built._lastPayload = (payload.args && typeof payload.args === 'object') ? payload.args : {};
                built._convId = currentConversationId || built._convId;
                activeToolCard = built;
                assistantMsg.appendChild(built.card);
              } else if (payload.type === 'progress') {
                if (activeToolCard) updateProgress(activeToolCard, payload.value, payload.eta_seconds);
              } else if (payload.type === 'heartbeat') {
                if (activeToolCard && activeToolCard.progMeta && activeToolCard._state === 'running') {
                  const pct = typeof activeToolCard._progress === 'number' ? activeToolCard._progress : 0;
                  activeToolCard.progMeta.textContent = pct + '% · 仍在處理…';
                }
              } else if (payload.type === 'tool') {
                if (activeToolCard) {
                  appendFrame(activeToolCard.body, payload.frame);
                  if (payload.frame && payload.frame.ok === false)
                    setCardStatus(activeToolCard, 'error', payload.frame.error || '執行失敗');
                  else if (payload.frame && payload.frame.ok === true)
                    setCardStatus(activeToolCard, 'ok');
                  const f = payload.frame || {};
                  const cand = (typeof f.progress === 'number' ? f.progress
                    : (typeof f.percent === 'number' ? f.percent
                    : (typeof f.value === 'number' ? f.value : null)));
                  const eta = (typeof f.eta_seconds === 'number' ? f.eta_seconds
                    : (typeof f.eta === 'number' ? f.eta
                    : (typeof f.remaining_ms === 'number' ? f.remaining_ms / 1000 : null)));
                  if (cand !== null) updateProgress(activeToolCard, cand, eta);
                }
              } else if (payload.type === 'done') {
                // 完成
                if (activeToolCard && activeToolCard._state === 'running') setCardStatus(activeToolCard, 'ok');
                if (activeToolCard && (!activeToolCard._convId) && payload.conversation_id) activeToolCard._convId = payload.conversation_id;
                // 串流完成後，刷新側欄會話清單以更新最後互動時間與新會話
                try {
                  const refreshed = await api.get(`/agents/${currentAgentId}/conversations`);
                  currentConversations = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
                  renderSidebar(currentConversations);
                } catch {}
              }
            } catch {}
          }
        }
        clearTimeout(timer);
        messageInput.value = '';
      } catch (e) {
        const isTimeout = !!(e && (e.name === 'AbortError' || String(e.message || '').includes('timeout')));
        if (isTimeout) {
          p.textContent += '\n系統忙碌中，請稍後再試。';
        } else {
          p.textContent += `\n[錯誤] ${(e && e.message) || '串流錯誤'}`;
        }
      } finally {
        messageInput.disabled = false;
        submitBtn.disabled = false;
        messageInput.value = '';
        messageInput.focus();
      }
    });

    loadAgents();
    if (autoRoutingMode && chatInitialHint) {
      chatInitialHint.textContent = '可直接開始對話，系統會自動由主代理分派。';
    }
  </script>
</body>
</html>
