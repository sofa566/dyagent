<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    /* 整體字體 */
    body { font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif; }

    .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; min-height: calc(100vh - 220px); height: calc(100vh - 220px); }

    /* sidebar 改善 */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.75rem;
      overflow-y: auto;
    }
    .sidebar h3 { margin-bottom: 0.5rem; font-size: 1rem; }
    .conv-list { list-style: none; margin: 0; padding: 0; }
    .conv-item {
      padding: 0.55rem 0.65rem;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .conv-item:hover { background: #f1f5ff; }
    .conv-item.active { background: #eef2ff; border-color: #c7d2fe; }
    .conv-title { font-weight: 600; font-size: 0.95rem; }
    .conv-meta { color: var(--text-secondary); font-size: 0.8rem; }

    .chat-container { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    /* 聊天訊息區背景 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f8f9fc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      min-height: 0;
      margin-bottom: 0.5rem;
    }

    /* 訊息氣泡 */
    .message {
      margin-bottom: 1.25rem;
      padding: 0.85rem 1.1rem;
      border-radius: 16px;
      max-width: 78%;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .message.user {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.25);
    }
    .message.assistant {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* 輸入區 */
    .chat-input {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      position: sticky;
      bottom: 0;
      background: var(--card-bg);
      padding: 0.75rem;
      border-top: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius) var(--radius);
      z-index: 4;
    }
    .chat-input textarea {
      flex: 1;
      resize: none;
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      border: 1.5px solid var(--border-color);
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .chat-input textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .btn-send {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
      align-self: flex-end;
    }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-send:hover:not(:disabled) { opacity: 0.9; }

    .agent-selector {
      margin-bottom: 1rem;
    }
    .conv-actions { position: relative; }
    .conv-menu-trigger { padding: 2px 8px; line-height: 1; }
    .conv-menu {
      position: absolute;
      top: 28px;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      min-width: 120px;
      padding: 4px;
      display: none;
      z-index: 8;
    }
    .conv-menu.open { display: block; }
    .conv-menu button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-primary);
    }
    .conv-menu button:hover { background: #f1f5f9; }
    .conv-menu .danger { color: #b91c1c; }

    /* JSON syntax highlight */
    .json { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .json .json-key { color: #6b7280; }
    .json .json-string { color: #0ea5e9; }
    .json .json-number { color: #d97706; }
    .json .json-boolean { color: #c0392b; }
    .json .json-null { color: #64748b; font-style: italic; }

    /* Tool card badges/alerts */
    .tool-badge { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; background: #9ca3af; }
    .tool-badge.running { background: #f59e0b; }
    .tool-badge.ok { background: #198754; }
    .tool-badge.error { background: #c0392b; }
    .tool-alert { background: #fdecea; color: #7f1d1d; border: 1px solid #f5c2c0; padding: 6px; border-radius: 6px; margin-top: 6px; display: none; }

    /* Progress */
    .tool-progress { margin-top: 6px; background: #f1f5f9; border: 1px solid #e5e7eb; height: 8px; border-radius: 999px; overflow: hidden; display: none; }
    .tool-progress__bar { height: 100%; width: 0%; background: #60a5fa; transition: width 0.2s ease, background-color 0.2s ease; }
    .tool-progress__meta { display: none; margin-top: 4px; font-size: 12px; color: var(--text-secondary); }

    /* ReAct trace */
    /* ── Markdown 輸出樣式 ── */
    .markdown-body { line-height: 1.7; font-size: 0.95rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
    .markdown-body h1 { font-size: 1.25em; } .markdown-body h2 { font-size: 1.1em; } .markdown-body h3 { font-size: 1em; }
    .markdown-body p { margin: 0.5em 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0.4em 0; }
    .markdown-body li { margin: 0.25em 0; }
    .markdown-body code { font-family: ui-monospace, 'Courier New', monospace; font-size: 0.88em; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .markdown-body pre { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0.6em 0; }
    .markdown-body pre code { background: transparent; color: inherit; padding: 0; font-size: 0.87em; }
    .markdown-body blockquote { border-left: 3px solid #c7d2fe; margin: 0.5em 0; padding: 4px 12px; color: var(--text-secondary); background: #f8faff; border-radius: 0 6px 6px 0; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.9em; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 6px 10px; }
    .markdown-body th { background: #f1f5f9; font-weight: 600; }
    .markdown-body a { color: #4f46e5; text-decoration: underline; }
    .markdown-body hr { border: none; border-top: 1px solid var(--border-color); margin: 0.8em 0; }
    .agent-output { margin: 6px 0; }
    .agent-output-label { display: inline-block; font-size: 0.74rem; font-weight: 700; color: #4f46e5; background: #eef2ff; border-radius: 4px; padding: 1px 6px; margin-bottom: 4px; }
    .message.user .markdown-body a { color: #c7d2fe; }

    /* routeInfo 樣式 */
    .route-info {
      display: inline-block;
      font-size: 0.75rem;
      color: #6366f1;
      background: #eef2ff;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .route-info.orchestrator-done {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #065f46;
      font-weight: 700;
    }

    /* orchestrator 計畫 */
    .orchestrator-plan {
      margin: 8px 0 10px;
      padding: 10px 12px;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      background: linear-gradient(135deg, #f0f4ff, #eef2ff);
      font-size: 0.88rem;
    }
    .orchestrator-plan-header {
      font-weight: 700;
      color: #4338ca;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .orchestrator-task-list {
      margin: 6px 0 0;
      padding-left: 20px;
    }
    .orchestrator-task-list li {
      margin: 4px 0;
      color: var(--text-secondary);
      font-size: 0.87rem;
    }

    /* agent badges */
    .agent-task-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-right: 6px;
      background: #e9ecef;
      color: #666;
      letter-spacing: 0.02em;
    }
    .agent-task-badge.running { background: #fef3c7; color: #d97706; }
    .agent-task-badge.done { background: #d1fae5; color: #065f46; }
    .agent-task-badge.error { background: #fee2e2; color: #991b1b; }
    .agent-text-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: #4f46e5;
      background: #eef2ff;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 8px 0 4px;
      width: fit-content;
      cursor: pointer;
      user-select: none;
    }
    .agent-detail { margin: 6px 0; }
    .agent-detail summary { list-style: none; }
    .agent-detail summary::before { content: '▶ '; font-size: 0.7rem; }
    .agent-detail[open] summary::before { content: '▼ '; }
    .agent-markdown { margin: 6px 0 4px; padding: 8px 10px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e5e7eb; }
    .synthesis-divider { border: none; border-top: 2px solid #c7d2fe; margin: 14px 0 8px; }
    .synthesis-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4338ca;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      border-radius: 6px;
      padding: 3px 10px;
      margin-bottom: 8px;
      width: fit-content;
      letter-spacing: 0.03em;
    }

    /* tool card */
    .tool-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
      margin: 8px 0;
      background: #fcfcfe;
    }

    @media (max-width: 900px) {
      .chat-layout { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 220px); }
      .chat-container { min-height: calc(100vh - 340px); }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>dyagent</h1>
    </div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>聊天</h2>
    <div id="error-message" class="error-message"></div>
    <div class="agent-selector">
      <label for="agent-select">選擇代理者：</label>
      <select id="agent-select">
        <option value="">請選擇代理者</option>
      </select>
    </div>
    <div class="chat-layout">
      <aside class="sidebar">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <h3 style="margin:0;">聊天紀錄</h3>
          <button id="new-conv" class="btn btn-secondary" type="button">新對話</button>
        </div>
        <ul id="conv-list" class="conv-list"></ul>
        <div id="conv-empty" class="conv-meta" style="display:none; text-align:center; padding: 0.5rem;">尚無聊天紀錄</div>
      </aside>
      <section class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <p id="chat-initial-hint" style="text-align: center; color: var(--text-secondary);">請選擇代理者開始對話</p>
        </div>
        <form id="chat-form" class="chat-input">
          <textarea id="message-input" rows="2" placeholder="輸入訊息… (Enter 送出，Shift+Enter 換行)" disabled></textarea>
          <button type="submit" class="btn-send" disabled>送出 ↵</button>
        </form>
      </section>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError } from '/main.js';
    import { marked } from 'marked';
    marked.setOptions({ breaks: true, gfm: true });

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    const currentUser = auth.getUser() || {};
    const autoRoutingMode = String(currentUser.role || '') === 'user';

    const agentSelect = document.getElementById('agent-select');
    const agentSelectorWrap = document.querySelector('.agent-selector');
    const chatMessages = document.getElementById('chat-messages');
    const chatInitialHint = document.getElementById('chat-initial-hint');
    const convList = document.getElementById('conv-list');
    const convEmpty = document.getElementById('conv-empty');
    const newConvBtn = document.getElementById('new-conv');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const submitBtn = chatForm.querySelector('button');

    // 追蹤目前串流中的工具卡片（需預先宣告，避免在 module 嚴格模式下 ReferenceError）
    let activeToolCard = null;

    // Textarea 自動高度與 Enter 送出
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    // 輔助：建立工具卡片（標題、狀態、內容、操作）
    function createToolCard(name) {
      const card = document.createElement('div');
      card.className = 'tool-card';

      const header = document.createElement('div');
      header.className = 'tool-card__header';
      header.style.display = 'flex';
      header.style.alignItems = 'center';
      header.style.justifyContent = 'space-between';

      const title = document.createElement('div');
      const badge = document.createElement('span');
      badge.className = 'tool-badge running';
      title.appendChild(badge);
      const titleText = document.createElement('span');
      titleText.innerHTML = `<strong>工具：</strong>${name}`;
      title.appendChild(titleText);

      const status = document.createElement('span');
      status.className = 'tool-card__status';
      status.textContent = '執行中…';
      status.style.color = 'var(--text-secondary)';

      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '6px';
      const collapseBtn = document.createElement('button');
      collapseBtn.className = 'btn';
      collapseBtn.textContent = '收合';
      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn';
      clearBtn.textContent = '清除內容';

      actions.appendChild(collapseBtn);
      actions.appendChild(clearBtn);

      header.appendChild(title);
      header.appendChild(status);
      header.appendChild(actions);

      const body = document.createElement('div');
      body.className = 'tool-card__body';
      body.style.marginTop = '6px';
      body.style.maxHeight = '240px';
      body.style.overflow = 'auto';
      body.style.background = 'var(--card-bg)';
      body.style.border = '1px dashed var(--border-color)';
      body.style.padding = '6px';

      collapseBtn.addEventListener('click', () => {
        const visible = body.style.display !== 'none';
        body.style.display = visible ? 'none' : 'block';
        collapseBtn.textContent = visible ? '展開' : '收合';
      });
      clearBtn.addEventListener('click', () => {
        body.innerHTML = '';
      });

      const alert = document.createElement('div');
      alert.className = 'tool-alert';

      const prog = document.createElement('div');
      prog.className = 'tool-progress';
      const bar = document.createElement('div');
      bar.className = 'tool-progress__bar';
      prog.appendChild(bar);
      const progMeta = document.createElement('div');
      progMeta.className = 'tool-progress__meta';
      progMeta.textContent = '0%';

      card.appendChild(header);
      card.appendChild(alert);
      card.appendChild(prog);
      card.appendChild(progMeta);
      card.appendChild(body);
      const meta = { card, body, status, badge, alert, prog, bar, progMeta, _state: 'running', _progress: 0, _t0: Date.now(), _lastTs: null, _lastProg: 0, _toolName: '', _lastPayload: {}, _convId: '' };
      return meta;
    }

    function appendFrame(container, frame) {
      const row = document.createElement('div');
      row.style.borderTop = '1px solid var(--border-subtle, #e5e5e5)';
      row.style.paddingTop = '6px';
      row.style.marginTop = '6px';

      const meta = document.createElement('div');
      meta.style.display = 'flex';
      meta.style.alignItems = 'center';
      meta.style.justifyContent = 'space-between';
      const ts = new Date().toLocaleTimeString();
      meta.innerHTML = `<span style="color:var(--text-secondary)">${ts}</span>`;

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn';
      copyBtn.textContent = '複製 JSON';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(JSON.stringify(frame, null, 2));
          copyBtn.textContent = '已複製';
          setTimeout(() => (copyBtn.textContent = '複製 JSON'), 1500);
        } catch {}
      });
      meta.appendChild(copyBtn);

      const pre = document.createElement('pre');
      pre.className = 'code json';
      pre.style.whiteSpace = 'pre-wrap';
      pre.innerHTML = syntaxHighlight(JSON.stringify(frame, null, 2));

      row.appendChild(meta);
      row.appendChild(pre);
      container.appendChild(row);
    }

    function setCardStatus(meta, state, msg) {
      // state: 'running' | 'ok' | 'error'
      meta._state = state;
      meta.badge.classList.remove('running', 'ok', 'error');
      if (state === 'ok') {
        meta.badge.classList.add('ok');
        meta.status.textContent = '完成';
        meta.status.style.color = 'var(--ok-color, #198754)';
        meta.alert.style.display = 'none';
        updateProgress(meta, 100, 0);
        meta.prog.style.display = 'none';
        meta.progMeta.style.display = 'none';
      } else if (state === 'error') {
        meta.badge.classList.add('error');
        meta.status.textContent = '失敗';
        meta.status.style.color = 'var(--error-color, #c0392b)';
        if (msg) {
          meta.alert.textContent = String(msg);
          meta.alert.style.display = 'block';
        }
        meta.prog.style.display = 'none';
        meta.progMeta.style.display = 'none';
      } else {
        meta.badge.classList.add('running');
        meta.status.textContent = '執行中…';
        meta.status.style.color = 'var(--text-secondary)';
        meta.alert.style.display = 'none';
        meta.prog.style.display = 'block';
        meta.progMeta.style.display = 'block';
      }
    }

    function updateProgress(meta, value, etaSeconds) {
      if (!meta || !meta.bar) return;
      let v = Number(value);
      if (Number.isNaN(v)) return;
      v = Math.max(0, Math.min(100, Math.round(v)));
      meta._progress = v;
      meta.bar.style.width = v + '%';
      // 色彩從紅(0)到綠(120)之間漸變
      const hue = Math.round((v / 100) * 120);
      meta.bar.style.backgroundColor = `hsl(${hue}, 70%, 50%)`;
      // 估算/顯示剩餘時間
      let etaText = '';
      if (typeof etaSeconds === 'number' && isFinite(etaSeconds) && etaSeconds >= 0) {
        etaText = ` · ${formatSeconds(etaSeconds)} 剩餘`;
      } else {
        const now = Date.now();
        if (meta._lastTs != null && v > meta._lastProg) {
          const dp = v - meta._lastProg;
          const dt = (now - meta._lastTs) / 1000; // s
          const speed = dp / dt; // % per s
          if (speed > 0 && v < 100) {
            const remain = (100 - v) / speed; // s
            if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
          }
        } else if (v > 0) {
          const elapsed = (now - (meta._t0 || now)) / 1000; // s
          const remain = elapsed * (100 - v) / v;
          if (isFinite(remain) && remain >= 0) etaText = ` · ${formatSeconds(remain)} 剩餘`;
        }
        meta._lastTs = now;
        meta._lastProg = v;
      }
      if (meta.progMeta) meta.progMeta.textContent = v + '%' + etaText;
      if (v >= 100 && meta._state === 'running') {
        // 自動標記完成
        setCardStatus(meta, 'ok');
      }
    }

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }


    let currentAgentId = null;
    let currentConversationId = null;
    let currentConversations = [];
    let agentRegistry = [];

    async function loadAgents() {
      try {
        // 先嘗試 public 清單（所有登入者可見）
        let response = await api.get('/agents/public');
        let agents = Array.isArray(response.agents) ? response.agents : [];
        agentRegistry = agents;
        // 若為 admin 且 public 為空，回退 /agents（需要 read_agent）
        try {
          const me = JSON.parse(localStorage.getItem('user') || 'null');
          if (me && me.role === 'admin' && agents.length === 0) {
            const resp2 = await api.get('/agents');
            agents = Array.isArray(resp2.agents) ? resp2.agents : agents;
          }
        } catch {}
        agentSelect.innerHTML = '<option value="">請選擇代理者</option>';
        if (agents.length === 0) {
          // 顯示提示：無代理者可選
          const hint = document.createElement('div');
          hint.className = 'conv-meta';
          hint.style.margin = '8px 0';
          hint.textContent = '目前沒有可選擇的代理者，請聯絡管理者建立。';
          const nav = document.querySelector('.nav-menu');
          const me = JSON.parse(localStorage.getItem('user') || 'null');
          if (me && me.role === 'admin') {
            const link = document.createElement('a');
            link.href = '/pages/create-agent.html';
            link.className = 'btn';
            link.style.marginLeft = '8px';
            link.textContent = '建立代理者';
            hint.appendChild(link);
            // 管理者：自動導向建立代理者精靈，降低空白狀態的迷惑
            setTimeout(() => {
              // 避免重複導向：若下拉已有資料（期間有新代理者建立）則不跳轉
              if (![...agentSelect.options].some(o => o.value)) {
                window.location.href = '/pages/create-agent.html';
              }
            }, 1200);
          }
          // 將提示插到 agentSelect 之後
          agentSelect.parentElement.appendChild(hint);
        } else {
          agents.forEach(agent => {
            const option = document.createElement('option');
            option.value = agent.id;
            option.textContent = agent.is_router ? `${agent.name}（主代理）` : agent.name;
            agentSelect.appendChild(option);
          });
        }

        if (autoRoutingMode && agentSelectorWrap) {
          agentSelectorWrap.style.display = 'none';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const agentParam = urlParams.get('agent');
        const lastAgent = localStorage.getItem('last_agent_id');
        if (autoRoutingMode) {
          const router = (agents || []).find((a) => !!a.is_router);
          const initial = (router && router.id) ? router.id : ((agents[0] && agents[0].id) || '');
          if (initial) {
            currentAgentId = initial;
            await selectAgent(initial);
          } else {
            chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">目前沒有可用代理者，請聯絡管理者。</p>';
          }
        } else {
          const initial = agentParam || lastAgent;
          if (initial && [...agentSelect.options].some(o => o.value === initial)) {
            agentSelect.value = initial;
            selectAgent(initial);
          }
        }
      } catch (error) {
        showError(error.message);
      }
    }

    async function selectAgent(agentId) {
      currentAgentId = agentId;
      messageInput.disabled = false;
      submitBtn.disabled = false;
      localStorage.setItem('last_agent_id', agentId);

      try {
        // 側欄載入中狀態
        convEmpty.style.display = 'none';
        convList.innerHTML = '<li class="conv-item"><div class="conv-meta">載入中…</div></li>';
        const response = await api.get(`/agents/${agentId}/conversations`);
        currentConversations = Array.isArray(response.conversations) ? response.conversations : [];
        renderSidebar(currentConversations);
        if (currentConversations.length > 0) {
          // 預設載入最新一筆
          currentConversationId = currentConversations[0].id;
          // 訊息面板載入中
          chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">載入中…</p>';
          renderMessagesById(currentConversationId);
        } else {
          chatMessages.innerHTML = '<p style="text-align: center;">可以開始對話了</p>';
        }
        // 不在前端進行 LLM 暖機，避免主代理或未配置模型造成噪音錯誤
      } catch (error) {
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--error-color);">載入失敗，請稍後再試</p>';
      }
    }

    function snippetTitle(conv) {
      if (conv.title && conv.title.trim()) return conv.title;
      const firstUser = (conv.messages || []).find(m => m.role === 'user');
      const text = firstUser ? (firstUser.content || '') : '';
      return text.length > 20 ? text.slice(0, 20) + '…' : (text || '新對話');
    }

    function closeAllConversationMenus() {
      document.querySelectorAll('.conv-menu.open').forEach((el) => el.classList.remove('open'));
    }

    function renderSidebar(conversations) {
      convList.innerHTML = '';
      if (!conversations || conversations.length === 0) {
        convEmpty.style.display = 'block';
        return;
      }
      convEmpty.style.display = 'none';
      conversations.forEach((c) => {
        const li = document.createElement('li');
        li.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
        li.dataset.id = c.id;
        const title = snippetTitle(c);
        const meta = c.last_interacted_at ? new Date(c.last_interacted_at).toLocaleString() : '';
        li.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
            <div class="conv-title" style="flex:1;">${title}</div>
            <div class="conv-actions">
              <button class="btn conv-menu-trigger" data-action="menu" title="操作選單">⋯</button>
              <div class="conv-menu" data-menu>
                <button type="button" data-action="rename">更名</button>
                <button type="button" class="danger" data-action="delete">刪除</button>
              </div>
            </div>
          </div>
          <div class="conv-meta">${meta}</div>
        `;
        li.addEventListener('click', (ev) => {
          if (ev.target && ev.target.closest && ev.target.closest('.conv-actions')) return;
          currentConversationId = c.id;
          renderMessagesById(c.id);
          Array.from(convList.children).forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          closeAllConversationMenus();
        });

        const menuBtn = li.querySelector('[data-action="menu"]');
        const menuBox = li.querySelector('[data-menu]');
        menuBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const willOpen = !menuBox.classList.contains('open');
          closeAllConversationMenus();
          if (willOpen) menuBox.classList.add('open');
        });

        li.querySelector('[data-action="rename"]').addEventListener('click', async (ev) => {
          ev.stopPropagation();
          closeAllConversationMenus();
          const newTitle = window.prompt('輸入新的會話標題（最多 200 字）', snippetTitle(c));
          if (!newTitle || !newTitle.trim()) return;
          try {
            const res = await api.put(`/conversations/${c.id}/title`, { title: newTitle.trim() });
            if (res && res.ok) {
              c.title = newTitle.trim();
              renderSidebar(conversations);
            }
          } catch (e) {
            showError(e.message || '重新命名失敗');
          }
        });

        li.querySelector('[data-action="delete"]').addEventListener('click', async (ev) => {
          ev.stopPropagation();
          closeAllConversationMenus();
          const ok = window.confirm('確定要刪除此聊天紀錄嗎？此操作無法復原。');
          if (!ok) return;
          try {
            const res = await api.delete(`/conversations/${c.id}`);
            if (res && res.ok) {
              currentConversations = (currentConversations || []).filter((x) => x.id !== c.id);
              if (currentConversationId === c.id) {
                currentConversationId = (currentConversations[0] && currentConversations[0].id) || null;
              }
              renderSidebar(currentConversations);
              if (currentConversationId) {
                renderMessagesById(currentConversationId);
              } else {
                chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">可以開始對話了</p>';
              }
            }
          } catch (e) {
            showError((e && e.message) || '刪除失敗');
          }
        });
        convList.appendChild(li);
      });
    }

    document.addEventListener('click', () => {
      closeAllConversationMenus();
    });

    function renderMessagesById(convId) {
      const conv = (currentConversations || []).find(c => c.id === convId);
      if (!conv) return;
      chatMessages.innerHTML = (conv.messages || []).map(msg => {
        const body = msg.role === 'assistant'
          ? `<div class="markdown-body">${marked.parse(msg.content || '')}</div>`
          : `<p>${escapeHTML(msg.content || '')}</p>`;
        return `<div class="message ${msg.role}">${body}<small style="opacity:0.7;">${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</small></div>`;
      }).join('');
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // 載入並渲染此對話的工具事件（持久化卡片）
      (async () => {
        try {
          const ev = await api.get(`/conversations/${convId}/events?types=tool_input,tool_result,tool_error`);
          const list = Array.isArray(ev.events) ? ev.events : [];
          list.forEach(e => {
            if (!e || !e.type) return;
            // 僅將 result/error 呈現為卡片；input 可作為後續擴充
            if (e.type === 'tool_result' || e.type === 'tool_error') {
              const name = (e.payload && e.payload.tool) ? e.payload.tool : 'tool';
              const meta = createToolCard(name);
              // result: 目前 payload 為 { tool, keys: [...] } 或完整 frame（若可用）
              // error: { tool, error }
              if (e.type === 'tool_error') {
                setCardStatus(meta, 'error', (e.payload && e.payload.error) || '執行失敗');
                appendFrame(meta.body, e.payload || {});
              } else {
                setCardStatus(meta, 'ok');
                appendFrame(meta.body, e.payload || {});
              }
              const holder = document.createElement('div');
              holder.appendChild(meta.card);
              chatMessages.appendChild(holder);
            }
          });
        } catch {}
      })();
    }

    // 安全轉義與簡易 JSON 語法高亮
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function syntaxHighlight(jsonText) {
      // 先整體轉義，確保安全
      let html = escapeHTML(jsonText);
      // 字串（含可能的鍵），先標記，再將作為鍵的字串（後接冒號）改為 key 樣式
      html = html.replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?/g, (match, group1, isKey) => {
        if (isKey) {
          return '<span class="json-key">' + group1 + '</span>:';
        }
        return '<span class="json-string">' + group1 + '</span>';
      });
      // 數字
      html = html.replace(/\b-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+\-]?\d+)?\b/g, (m) => '<span class="json-number">' + m + '</span>');
      // 布林與 null
      html = html.replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>');
      html = html.replace(/\bnull\b/g, '<span class="json-null">null</span>');
      return html;
    }

    agentSelect.addEventListener('change', (e) => {
      if (autoRoutingMode) return;
      if (e.target.value) {
        selectAgent(e.target.value);
      } else {
        currentAgentId = null;
        messageInput.disabled = true;
        submitBtn.disabled = true;
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">請選擇代理者開始對話</p>';
      }
    });

    newConvBtn.addEventListener('click', async () => {
      if (!currentAgentId) {
        showError(autoRoutingMode ? '目前尚未取得可用代理者，請先送出一則訊息或聯絡管理者' : '請先選擇代理者');
        return;
      }
      try {
        const res = await api.post(`/agents/${currentAgentId}/conversations`, {});
        if (res && res.id) {
          // 將新會話插入最前面
          const conv = {
            id: res.id,
            agent_id: res.agent_id,
            title: res.title || '',
            messages: [],
            created_at: res.created_at,
            last_interacted_at: res.last_interacted_at,
          };
          currentConversations = [conv, ...(currentConversations || [])];
          currentConversationId = conv.id;
          renderSidebar(currentConversations);
          renderMessagesById(currentConversationId);
          messageInput.focus();
        }
      } catch (e) {
        showError(e.message || '新對話建立失敗');
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = (messageInput.value || '').trim();
      if (!msg || !currentAgentId) return;
      const STREAM_TIMEOUT_MS = 120000;
      messageInput.disabled = true;
      submitBtn.disabled = true;
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<p>${escapeHTML(msg)}</p>`;
      chatMessages.appendChild(userMsg);
      // 建立助理訊息區塊
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      const routeInfo = document.createElement('div');
      routeInfo.className = 'route-info';
      routeInfo.textContent = '主代理分派中…';
      const p = document.createElement('div');
      p.className = 'markdown-body';
      assistantMsg.appendChild(routeInfo);
      assistantMsg.appendChild(p);
      chatMessages.appendChild(assistantMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      // 串流聊天
      try {
        const token = localStorage.getItem('auth_token');
        const selected = (agentRegistry || []).find((a) => String(a.id) === String(currentAgentId));
        const useUnifiedEntry = !!autoRoutingMode || !!(selected && selected.is_router);
        const url = useUnifiedEntry
          ? '/api/chat'
          : (`/api/agents/${currentAgentId}/chat/stream?` + new URLSearchParams({ message: msg }));
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort('timeout'), STREAM_TIMEOUT_MS);
        let resp = await fetch(url, {
          method: useUnifiedEntry ? 'POST' : 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
          },
          body: useUnifiedEntry ? JSON.stringify({ message: msg }) : undefined,
          signal: controller.signal,
        });
        if (!resp.ok && resp.status === 503) {
          // 後端重啟或模型路由短暫不可用時，做一次短暫重試
          await new Promise((r) => setTimeout(r, 1200));
          resp = await fetch(url, {
            method: useUnifiedEntry ? 'POST' : 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              ...(useUnifiedEntry ? { 'Content-Type': 'application/json' } : {}),
            },
            body: useUnifiedEntry ? JSON.stringify({ message: msg }) : undefined,
            signal: controller.signal,
          });
        }
        if (!resp.ok || !resp.body) {
          clearTimeout(timer);
          p.textContent = `串流失敗：HTTP ${resp.status}`;
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        // ── 多代理協作 UI 狀態 ──
        let orchestratorPlanEl = null;      // 任務清單容器
        const agentTaskBadges = new Map();  // task_index → badge element
        // ── Markdown 累積 ──
        let accText = '';                   // 單代理累積文字
        const agentAccTexts = new Map();    // task_index → 子代理累積文字
        const agentDivs = new Map();        // task_index → 子代理渲染 div
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!chunk.startsWith('data: ')) continue;
            try {
              const payload = JSON.parse(chunk.replace(/^data:\s*/, ''));
              if (payload.type === 'text' && typeof payload.delta === 'string') {
                accText += payload.delta;
                // 避免把內部工具協議 [[CALL ...]] 顯示給使用者
                accText = accText.replace(/\[\[CALL tool=[^\]]+\]\]\s*(\{[\s\S]*?\})?/g, '').trimStart();
                accText = accText.replace(/```json\s*\{[\s\S]*?\}\s*```/gi, '').trimStart();
                accText = accText.replace(/\{\s*"tool_calls"\s*:\s*\[[\s\S]*?\]\s*\}/g, '').trimStart();
                p.innerHTML = marked.parse(accText);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (payload.type === 'route.decision') {
                if (payload.target_agent_name) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_name)} 代理者回覆`;
                } else if (payload.target_agent_id) {
                  routeInfo.textContent = `本輪由：${String(payload.target_agent_id)} 代理者回覆`;
                }
                if (payload.target_agent_id) {
                  currentAgentId = String(payload.target_agent_id);
                  if (!autoRoutingMode) {
                    try { agentSelect.value = String(payload.target_agent_id); } catch {}
                  }
                }
              } else if (payload.type === 'orchestrator.thinking') {
                routeInfo.textContent = payload.message || '多代理分析中…';
              } else if (payload.type === 'orchestrator.plan') {
                // 顯示多代理協作任務清單（可折疊）
                routeInfo.textContent = `多代理協作（第 ${payload.react_step || 1} 輪）`;
                if (!orchestratorPlanEl) {
                  orchestratorPlanEl = document.createElement('div');
                  orchestratorPlanEl.className = 'orchestrator-plan';
                  assistantMsg.insertBefore(orchestratorPlanEl, p);
                } else {
                  orchestratorPlanEl.innerHTML = '';
                  agentTaskBadges.clear();
                  agentAccTexts.clear();
                  agentDivs.clear();
                }
                const header = document.createElement('div');
                header.className = 'orchestrator-plan-header';
                header.textContent = `📋 協作計畫（${(payload.tasks || []).length} 個任務）`;
                header.style.cursor = 'pointer';
                const taskList = document.createElement('ul');
                taskList.className = 'orchestrator-task-list';
                header.addEventListener('click', () => {
                  taskList.style.display = taskList.style.display === 'none' ? '' : 'none';
                });
                (payload.tasks || []).forEach((t, i) => {
                  const li = document.createElement('li');
                  const badge = document.createElement('span');
                  badge.className = 'agent-task-badge';
                  badge.textContent = '待執行';
                  li.appendChild(badge);
                  li.append(` [${t.agent_name || t.agent_id || ''}] ${t.task || ''}`);
                  taskList.appendChild(li);
                  agentTaskBadges.set(t.task_index != null ? t.task_index : i, badge);
                });
                orchestratorPlanEl.appendChild(header);
                orchestratorPlanEl.appendChild(taskList);
              } else if (payload.type === 'agent.start') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '處理中…'; badge.className = 'agent-task-badge running'; }
              } else if (payload.type === 'agent.text' && typeof payload.delta === 'string') {
                const tIdx = payload.task_index;
                const isSynthesis = (tIdx === -1);
                if (!agentDivs.has(tIdx)) {
                  if (isSynthesis) {
                    // 合成結果：分隔線 + 標題 + 獨立 markdown div
                    const hr = document.createElement('hr');
                    hr.className = 'synthesis-divider';
                    const synLabel = document.createElement('div');
                    synLabel.className = 'synthesis-label';
                    synLabel.textContent = '綜合回覆';
                    const synDiv = document.createElement('div');
                    synDiv.className = 'markdown-body';
                    p.appendChild(hr);
                    p.appendChild(synLabel);
                    p.appendChild(synDiv);
                    agentDivs.set(tIdx, synDiv);
                  } else {
                    // 子代理：可折疊區塊
                    const details = document.createElement('details');
                    details.className = 'agent-detail';
                    const summary = document.createElement('summary');
                    summary.className = 'agent-text-label';
                    summary.textContent = `${payload.agent_name || '代理者'} 的回覆`;
                    const agentDiv = document.createElement('div');
                    agentDiv.className = 'markdown-body agent-markdown';
                    details.appendChild(summary);
                    details.appendChild(agentDiv);
                    p.appendChild(details);
                    agentDivs.set(tIdx, agentDiv);
                  }
                  agentAccTexts.set(tIdx, '');
                }
                let agentAcc = (agentAccTexts.get(tIdx) || '') + payload.delta;
                agentAcc = agentAcc.replace(/\[\[CALL tool=[^\]]+\]\]\s*(\{[\s\S]*?\})?/g, '').trimStart();
                agentAccTexts.set(tIdx, agentAcc);
                agentDivs.get(tIdx).innerHTML = marked.parse(agentAcc);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (payload.type === 'agent.done') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '✓ 完成'; badge.className = 'agent-task-badge done'; }
              } else if (payload.type === 'agent.error') {
                const badge = agentTaskBadges.get(payload.task_index);
                if (badge) { badge.textContent = '✗ 失敗'; badge.className = 'agent-task-badge error'; }
              } else if (payload.type === 'orchestrator.synthesizing') {
                routeInfo.textContent = `Router 合成中（第 ${payload.react_step || 1} 輪）…`;
              } else if (payload.type === 'orchestrator.retry') {
                routeInfo.textContent = `重新規劃中（第 ${(payload.react_step || 1) + 1} 輪）…`;
                // 新輪次清空文字區，準備接收新合成結果
                accText = '';
                p.innerHTML = '';
                agentAccTexts.clear();
                agentDivs.clear();
              } else if (payload.type === 'orchestrator.done') {
                routeInfo.textContent = `多代理協作完成（${payload.completed || 0} 個代理，共 ${payload.react_steps_used || 1} 輪）`;
                routeInfo.classList.add('orchestrator-done');
                try {
                  const refreshed = await api.get(`/agents/${currentAgentId}/conversations`);
                  currentConversations = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
                  renderSidebar(currentConversations);
                } catch {}
              } else if (payload.type === 'tool_start') {
                const built = createToolCard(payload.name);
                built._toolName = payload.name;
                built._lastPayload = (payload.args && typeof payload.args === 'object') ? payload.args : {};
                built._convId = currentConversationId || built._convId;
                activeToolCard = built;
                assistantMsg.appendChild(built.card);
              } else if (payload.type === 'progress') {
                if (activeToolCard) updateProgress(activeToolCard, payload.value, payload.eta_seconds);
              } else if (payload.type === 'heartbeat') {
                if (activeToolCard && activeToolCard.progMeta && activeToolCard._state === 'running') {
                  const pct = typeof activeToolCard._progress === 'number' ? activeToolCard._progress : 0;
                  activeToolCard.progMeta.textContent = pct + '% · 仍在處理…';
                }
              } else if (payload.type === 'tool') {
                if (activeToolCard) {
                  appendFrame(activeToolCard.body, payload.frame);
                  if (payload.frame && payload.frame.ok === false)
                    setCardStatus(activeToolCard, 'error', payload.frame.error || '執行失敗');
                  else if (payload.frame && payload.frame.ok === true)
                    setCardStatus(activeToolCard, 'ok');
                  const f = payload.frame || {};
                  const cand = (typeof f.progress === 'number' ? f.progress
                    : (typeof f.percent === 'number' ? f.percent
                    : (typeof f.value === 'number' ? f.value : null)));
                  const eta = (typeof f.eta_seconds === 'number' ? f.eta_seconds
                    : (typeof f.eta === 'number' ? f.eta
                    : (typeof f.remaining_ms === 'number' ? f.remaining_ms / 1000 : null)));
                  if (cand !== null) updateProgress(activeToolCard, cand, eta);
                }
              } else if (payload.type === 'done') {
                // 完成
                if (activeToolCard && activeToolCard._state === 'running') setCardStatus(activeToolCard, 'ok');
                if (activeToolCard && (!activeToolCard._convId) && payload.conversation_id) activeToolCard._convId = payload.conversation_id;
                // 串流完成後，刷新側欄會話清單以更新最後互動時間與新會話
                try {
                  const refreshed = await api.get(`/agents/${currentAgentId}/conversations`);
                  currentConversations = Array.isArray(refreshed.conversations) ? refreshed.conversations : [];
                  renderSidebar(currentConversations);
                } catch {}
              }
            } catch {}
          }
        }
        clearTimeout(timer);
        messageInput.value = '';
        messageInput.style.height = 'auto';
      } catch (e) {
        const isTimeout = !!(e && (e.name === 'AbortError' || String(e.message || '').includes('timeout')));
        if (isTimeout) {
          accText += '\n\n系統忙碌中，請稍後再試。';
        } else {
          accText += `\n\n[錯誤] ${(e && e.message) || '串流錯誤'}`;
        }
        p.innerHTML = marked.parse(accText);
      } finally {
        messageInput.disabled = false;
        submitBtn.disabled = false;
        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
      }
    });

    loadAgents();
    if (autoRoutingMode && chatInitialHint) {
      chatInitialHint.textContent = '可直接開始對話，系統會自動由主代理分派。';
    }
  </script>
</body>
</html>
