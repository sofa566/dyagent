<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>創建代理者 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>dyagent</h1>
    </div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>創建代理者</h2>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    <div class="card">
      <form id="create-agent-form">
        <div class="form-group">
          <label for="name">代理者名稱 *</label>
          <input type="text" id="name" name="name" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="description">功能描述</label>
          <textarea id="description" name="description" rows="4" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label for="system_prompt">System Prompt（系統提示詞）</label>
          <textarea id="system_prompt" name="system_prompt" rows="6" maxlength="10000" placeholder="輸入代理者專屬的系統提示詞，用於指導 LLM 的行為和角色定位..."></textarea>
          <small style="color: var(--text-secondary);">此欄位優先於「功能描述」作為 LLM 的 system prompt。若留空則使用「功能描述」作為 fallback。</small>
        </div>
        <div class="form-group">
          <label for="model_type">模型類型 *</label>
          <select id="model_type" name="model_type" required>
            <option value="cloud">雲端模型 (Cloud)</option>
            <option value="local">地端模型 (Local)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="agent_class">代理者類別 *</label>
          <select id="agent_class" name="agent_class" required>
            <option value="tasked">任務類 (tasked)</option>
            <option value="public">公眾類 (public)</option>
            <option value="master">主代理類 (master)</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="enabled" name="enabled" checked>
            啟用此代理者
          </label>
        </div>
        <div class="form-group">
          <label for="provider">模型提供者</label>
          <select id="provider" name="provider">
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="ollama">Ollama</option>
          </select>
        </div>
        <div class="form-group">
          <label for="model_name">模型名稱</label>
          <input type="text" id="model_name" name="model_name" placeholder="例如: gpt-4, claude-3">
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">創建</button>
          <a href="/pages/agent-list.html" class="btn btn-secondary">取消</a>
        </div>
      </form>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError, showSuccess } from '/main.js';

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    const agentClassSelect = document.getElementById('agent_class');
    const enabledInput = document.getElementById('enabled');

    function syncEnabledControlByClass() {
      const isMaster = (agentClassSelect.value || '').toLowerCase() === 'master';
      if (isMaster) {
        enabledInput.checked = true;
        enabledInput.disabled = true;
        return;
      }
      enabledInput.disabled = false;
    }

    agentClassSelect.addEventListener('change', syncEnabledControlByClass);
    syncEnabledControlByClass();

    document.getElementById('create-agent-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const system_prompt = document.getElementById('system_prompt').value;
      const model_type = document.getElementById('model_type').value;
      const agent_class = document.getElementById('agent_class').value;
      const enabled = document.getElementById('enabled').checked;
      const provider = document.getElementById('provider').value;
      const model_name = document.getElementById('model_name').value;

      const model_config = {
        provider,
        model_name: model_name || (provider === 'openai' ? 'gpt-4' : 'claude-3'),
      };

      try {
        // 後端 /api/agents 期望參數以 query 形式傳遞（name/description/model_type/system_prompt）
        const qs = new URLSearchParams({
          name,
          description,
          system_prompt,
          model_type,
          agent_class,
          enabled: String(enabled),
        });
        await api.request(`/agents?${qs.toString()}`, { method: 'POST' });
        showSuccess('代理者創建成功！');
        setTimeout(() => {
          window.location.href = '/pages/agent-list.html';
        }, 1000);
      } catch (error) {
        showError(error.message);
      }
    });
  </script>
</body>
</html>
