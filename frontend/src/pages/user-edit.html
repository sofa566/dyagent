<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編輯使用者 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><h1>dyagent</h1></div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/users.html">使用者管理</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>編輯使用者</h2>
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    <div class="card">
      <form id="user-form">
        <div class="form-group">
          <label>使用者名稱</label>
          <input id="username" type="text" disabled>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="text" disabled>
        </div>
        <div class="form-group">
          <label>角色</label>
          <select id="role">
            <option value="user">user</option>
            <option value="agent_admin">agent_admin</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">儲存</button>
          <a href="/pages/users.html" class="btn btn-secondary">返回</a>
        </div>
      </form>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError, showSuccess } from '/main.js';

    const SYSTEM_ROLE_CODES = ['admin', 'agent_admin', 'user'];
    const state = {
      roles: [],
      selectedRoleId: '',
    };

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }
    const me = auth.getUser();
    if (!me || me.role !== 'admin') {
      showError('僅限管理者使用');
      setTimeout(()=> window.location.href='/pages/chat.html', 1500);
    }

    const url = new URL(window.location.href);
    const userId = url.searchParams.get('id');
    if (!userId) {
      showError('缺少使用者 id');
      setTimeout(()=> window.location.href='/pages/users.html', 1500);
    }

    function findRoleById(roleId) {
      return state.roles.find(roleItem => String(roleItem.id) === String(roleId));
    }

    function findRoleByCode(roleCode) {
      return state.roles.find(roleItem => String(roleItem.code) === String(roleCode));
    }

    function getDefaultRoleId() {
      const userRole = findRoleByCode('user');
      if (userRole) {
        return String(userRole.id);
      }
      const firstRole = state.roles[0];
      return firstRole ? String(firstRole.id) : '';
    }

    function renderRoleOptions(selectedRoleId = '') {
      const roleSelectElement = document.getElementById('role');
      if (!state.roles.length) {
        roleSelectElement.innerHTML = '<option value="">目前沒有可用角色</option>';
        roleSelectElement.value = '';
        state.selectedRoleId = '';
        return;
      }
      roleSelectElement.innerHTML = state.roles
        .map(roleItem => `<option value="${String(roleItem.id)}">${String(roleItem.code)} (${String(roleItem.name || roleItem.code)})</option>`)
        .join('');
      const matchedRole = findRoleById(selectedRoleId);
      const nextRoleId = matchedRole ? String(matchedRole.id) : getDefaultRoleId();
      roleSelectElement.value = nextRoleId;
      state.selectedRoleId = nextRoleId;
    }

    async function loadRoles() {
      const rolesResponse = await api.get('/access/roles');
      const roleList = Array.isArray(rolesResponse.roles) ? rolesResponse.roles : [];
      state.roles = roleList
        .filter(roleItem => !!roleItem.enabled)
        .sort((leftRole, rightRole) => String(leftRole.code || '').localeCompare(String(rightRole.code || '')));
      renderRoleOptions(getDefaultRoleId());
    }

    async function loadUser() {
      try {
        const res = await api.get('/users');
        const list = Array.isArray(res.users) ? res.users : [];
        const u = list.find(x => x.id === userId);
        if (!u) { showError('找不到使用者'); return; }
        document.getElementById('username').value = u.username || '';
        document.getElementById('email').value = u.email || '';

        const bindingPayload = await api.get(`/access/users/${encodeURIComponent(userId)}/bindings`);
        const bindingRoleIds = Array.isArray(bindingPayload.role_ids) ? bindingPayload.role_ids : [];
        const primaryRole = findRoleByCode(u.role || '');
        if (primaryRole && bindingRoleIds.includes(String(primaryRole.id))) {
          renderRoleOptions(String(primaryRole.id));
          return;
        }
        const firstMatchedRoleId = bindingRoleIds.find(roleId => !!findRoleById(roleId));
        renderRoleOptions(firstMatchedRoleId ? String(firstMatchedRoleId) : getDefaultRoleId());
      } catch (e) {
        showError(e.message || '載入使用者失敗');
      }
    }

    document.getElementById('role').addEventListener('change', (event) => {
      state.selectedRoleId = String(event.target.value || '');
    });

    document.getElementById('user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const selectedRole = findRoleById(state.selectedRoleId);
        if (!selectedRole) {
          showError('請先選擇角色');
          return;
        }

        if (SYSTEM_ROLE_CODES.includes(String(selectedRole.code))) {
          await api.put(`/users/${userId}/role?role=${encodeURIComponent(String(selectedRole.code))}`);
        }
        await api.post(`/access/users/${encodeURIComponent(userId)}/roles`, {
          role_ids: [String(selectedRole.id)],
        });
        showSuccess('角色已更新');
      } catch (e) {
        showError(e.message || '更新失敗');
      }
    });

    Promise.all([loadRoles()]).then(() => loadUser());
  </script>
</body>
</html>
