<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儀表板 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .tab-bar { display: inline-flex; border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; margin: 8px 0 14px; }
    .tab-btn { border: none; background: #fff; color: var(--text-secondary); padding: 8px 14px; cursor: pointer; }
    .tab-btn.active { background: var(--primary-color); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
    .stat { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background: #fff; }
    .stat .label { color: var(--text-secondary); font-size: 0.85rem; }
    .stat .value { font-size: 1.4rem; font-weight: 700; }
    .section-title { margin: 10px 0 6px; }
    .service-ok { color: #15803d; font-weight: 600; }
    .service-down { color: #b91c1c; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.86rem; }
    .table-wrap { overflow-x: auto; }
    table.metrics { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    table.metrics th, table.metrics td { border-bottom: 1px solid var(--border-color); padding: 8px 10px; text-align: left; white-space: nowrap; }
    table.metrics th { color: var(--text-secondary); font-weight: 600; }
    table.metrics th.num, table.metrics td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.logs { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    table.logs th, table.logs td { border-bottom: 1px solid var(--border-color); padding: 8px 10px; text-align: left; white-space: nowrap; }
    table.logs th { color: var(--text-secondary); font-weight: 600; }
    .audit-filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
    .pill-dangerous { color:#991b1b; font-weight:600; }
    .pill-restricted { color:#b45309; font-weight:600; }
    .pill-safe { color:#166534; font-weight:600; }
    .audit-summary-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:8px; margin-bottom:10px; }
    .audit-detail-toggle { cursor:pointer; color: var(--primary-color); text-decoration: underline; }
    .audit-detail-row td { background:#f8fafc; }
    .audit-detail-pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:0.83rem; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="nav-brand">
        <h1>dyagent</h1>
      </div>
      <div class="nav-menu">
        <a href="/pages/dashboard.html">儀表板</a>
        <a href="/pages/agent-list.html">代理者</a>
        <a href="/pages/chat.html">聊天</a>
        <a href="/pages/login.html" id="auth-link">登入</a>
      </div>
    </nav>
    <main class="container">
      <h2>系統監控中心</h2>

      <div class="tab-bar" id="dashboard-tab-bar">
        <button id="tab-monitor" class="tab-btn active" type="button">系統監控儀表板</button>
        <button id="tab-logs" class="tab-btn" type="button">系統日誌</button>
      </div>

      <section id="monitor-panel" class="tab-panel active">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <strong>即時狀態</strong>
            <div class="mono" id="updated-at">更新中...</div>
          </div>
          <div id="services" class="stats-grid"></div>
        </div>

        <div class="card">
          <h3 class="section-title">系統資源</h3>
          <div id="resources" class="stats-grid"></div>
        </div>

        <div class="card">
          <h3 class="section-title">代理者 / 使用者 / 流量</h3>
          <div id="core-stats" class="stats-grid"></div>
        </div>

        <div class="card">
          <h3 class="section-title">LLM / ReAct 使用狀態（近 24 小時）</h3>
          <div id="llm-stats" class="stats-grid"></div>
        </div>

        <div class="card">
          <h3 class="section-title">代理者 Token / Cost（近 24 小時）</h3>
          <div id="agent-llm-breakdown" class="table-wrap"></div>
        </div>

        <div class="card">
          <h3 class="section-title">工具策略稽核（近 7 天）</h3>
          <div class="audit-filters">
            <label for="audit-status-filter">狀態：</label>
            <select id="audit-status-filter">
              <option value="">全部</option>
              <option value="denied">denied</option>
              <option value="success">success</option>
              <option value="error">error</option>
            </select>
            <label for="audit-risk-filter">風險：</label>
            <select id="audit-risk-filter">
              <option value="">全部</option>
              <option value="dangerous">dangerous</option>
              <option value="restricted">restricted</option>
              <option value="safe">safe</option>
            </select>
            <button id="audit-refresh-btn" class="btn btn-secondary" type="button">更新稽核</button>
          </div>
          <div id="tool-policy-audit-summary" class="audit-summary-grid"></div>
          <div id="tool-policy-top-risk-tools" class="mono" style="margin-bottom:8px;"></div>
          <div id="tool-policy-audits" class="table-wrap"></div>
        </div>

        <div class="actions">
          <a href="/pages/agent-list.html" class="btn btn-secondary">管理代理者</a>
          <a href="/pages/chat.html" class="btn btn-primary">前往聊天</a>
          <button id="refresh-btn" class="btn btn-secondary" type="button">立即刷新</button>
        </div>
      </section>

      <section id="logs-panel" class="tab-panel">
        <div class="card">
          <div class="form-group">
            <label for="level-filter">日誌級別：</label>
            <select id="level-filter">
              <option value="">全部</option>
              <option value="debug">Debug</option>
              <option value="info">Info</option>
              <option value="warning">Warning</option>
              <option value="error">Error</option>
            </select>
          </div>
        </div>
        <div id="logs-list" class="card"><p>載入中...</p></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { api, auth, getCapabilities, hasAnyPermission } from '/main.js';

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    let logsLoaded = false;
    let hasMonitorPermission = false;
    let hasLogsPermission = false;
    let hasLoadedToolAudits = false;
    let latestToolPolicyOverview = null;

    function setActiveTab(tabName) {
      document.getElementById('tab-monitor').classList.toggle('active', tabName === 'monitor');
      document.getElementById('tab-logs').classList.toggle('active', tabName === 'logs');
      document.getElementById('monitor-panel').classList.toggle('active', tabName === 'monitor');
      document.getElementById('logs-panel').classList.toggle('active', tabName === 'logs');
      if (tabName === 'logs' && hasLogsPermission && !logsLoaded) {
        loadLogs();
      }
    }

    function mkStat(label, value) {
      return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function toMB(v) {
      if (typeof v !== 'number' || !Number.isFinite(v)) return '-';
      return (v / (1024 * 1024)).toFixed(0) + ' MB';
    }

    function renderOverview(data) {
      const services = data.services || {};
      const resources = data.resources || {};
      const agents = data.agents || {};
      const users = data.users || {};
      const traffic = data.traffic || {};
      const llm = data.llm || {};
      latestToolPolicyOverview = (data && typeof data.tool_policy === 'object' && data.tool_policy) ? data.tool_policy : null;
      const llmBreakdown = Array.isArray(llm.agent_breakdown_24h) ? llm.agent_breakdown_24h : [];

      document.getElementById('updated-at').textContent =
        data.updated_at ? new Date(data.updated_at).toLocaleString() : '更新時間未知';

      document.getElementById('services').innerHTML = [
        mkStat('Database', `<span class="${services.database === 'ok' ? 'service-ok' : 'service-down'}">${services.database || 'unknown'}</span>`),
        mkStat('Redis', `<span class="${services.redis === 'ok' ? 'service-ok' : 'service-down'}">${services.redis || 'unknown'}</span>`),
        mkStat('Qdrant', `<span class="${services.qdrant === 'ok' ? 'service-ok' : 'service-down'}">${services.qdrant || 'unknown'}</span>`),
      ].join('');

      const cpu = resources.cpu || {};
      const memory = resources.memory || {};
      const disk = resources.disk || {};
      document.getElementById('resources').innerHTML = [
        mkStat('CPU Load (1m)', `${cpu.load_percent_1m ?? '-'}%`),
        mkStat('CPU Cores', cpu.cores ?? '-'),
        mkStat('Memory Used', `${memory.used_percent ?? '-'}%`),
        mkStat('Memory Used', toMB(memory.used_bytes)),
        mkStat('Disk Used', `${disk.used_percent ?? '-'}%`),
        mkStat('Disk Free', toMB(disk.free_bytes)),
      ].join('');

      document.getElementById('core-stats').innerHTML = [
        mkStat('Agents 總數', agents.total ?? 0),
        mkStat('Agents 活躍(24h)', agents.active_24h ?? 0),
        mkStat('Cloud / Local', `${agents.cloud ?? 0} / ${agents.local ?? 0}`),
        mkStat('Users 總數', users.total ?? 0),
        mkStat('線上使用者(15m)', users.online_15m ?? 0),
        mkStat('Conversations(24h)', traffic.conversations_24h ?? 0),
        mkStat('Messages(24h)', traffic.messages_24h ?? 0),
      ].join('');

      document.getElementById('llm-stats').innerHTML = [
        mkStat('輸出字元(24h)', llm.output_chars_24h ?? 0),
        mkStat('輸出 tokens 估算', llm.output_tokens_approx_24h ?? 0),
        mkStat('成本估算 USD', llm.cost_estimate_usd_24h ?? 0),
        mkStat('LLM 審計筆數', llm.turn_rows_24h ?? 0),
        mkStat('ReAct 執行次數', llm.react_runs_24h ?? 0),
        mkStat('ReAct 步驟數', llm.react_steps_24h ?? 0),
        mkStat('工具成功 / 失敗', `${llm.tool_success_24h ?? 0} / ${llm.tool_error_24h ?? 0}`),
      ].join('');

      if (!llmBreakdown.length) {
        document.getElementById('agent-llm-breakdown').innerHTML = '<div class="mono">目前無 LLM 使用紀錄</div>';
      } else {
        const rows = llmBreakdown.map((row) => {
          const name = row.agent_name || '-';
          const turns = Number(row.turns || 0);
          const inputTokens = Number(row.input_tokens || 0);
          const outputTokens = Number(row.output_tokens || 0);
          const totalTokens = Number(row.total_tokens || 0);
          const cost = Number(row.cost_usd || 0).toFixed(6);
          const estimatedTag = row.estimated ? '（估算）' : '';
          return `<tr>
            <td>${name}${estimatedTag}</td>
            <td class="num">${turns}</td>
            <td class="num">${inputTokens}</td>
            <td class="num">${outputTokens}</td>
            <td class="num">${totalTokens}</td>
            <td class="num">${cost}</td>
          </tr>`;
        }).join('');

        document.getElementById('agent-llm-breakdown').innerHTML = `
          <table class="metrics">
            <thead>
              <tr>
                <th>代理者</th>
                <th class="num">輪次</th>
                <th class="num">輸入 Tokens</th>
                <th class="num">輸出 Tokens</th>
                <th class="num">總 Tokens</th>
                <th class="num">Cost (USD)</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }
    }

    function getRiskClass(riskLevel) {
      const value = String(riskLevel || '').trim();
      if (value === 'dangerous') return 'pill-dangerous';
      if (value === 'restricted') return 'pill-restricted';
      return 'pill-safe';
    }

    function escapeHtml(rawText) {
      return String(rawText || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildAuditSummaryRows(rows, toolPolicyOverview) {
      const overview = (toolPolicyOverview && typeof toolPolicyOverview === 'object') ? toolPolicyOverview : null;
      if (overview) {
        const deniedRate = Number(overview.denied_rate_7d || 0);
        const highRiskRate = Number(overview.high_risk_rate_7d || 0);
        const dangerousCount = Number(overview.dangerous_7d || 0);
        const restrictedCount = Number(overview.restricted_7d || 0);
        return [
          mkStat('稽核筆數', Number(overview.total_7d || 0)),
          mkStat('拒絕率', `${deniedRate.toFixed(1)}%`),
          mkStat('高風險占比', `${highRiskRate.toFixed(1)}%`),
          mkStat('dangerous / restricted', `${dangerousCount} / ${restrictedCount}`),
        ];
      }
      const totalCount = rows.length;
      const deniedCount = rows.filter((row) => String(row.status || '') === 'denied').length;
      const dangerousCount = rows.filter((row) => String(row.risk_level || '') === 'dangerous').length;
      const restrictedCount = rows.filter((row) => String(row.risk_level || '') === 'restricted').length;
      const deniedRate = totalCount > 0 ? ((deniedCount / totalCount) * 100) : 0;
      const highRiskRate = totalCount > 0 ? (((dangerousCount + restrictedCount) / totalCount) * 100) : 0;
      return [
        mkStat('稽核筆數', totalCount),
        mkStat('拒絕率', `${deniedRate.toFixed(1)}%`),
        mkStat('高風險占比', `${highRiskRate.toFixed(1)}%`),
        mkStat('dangerous / restricted', `${dangerousCount} / ${restrictedCount}`),
      ];
    }

    function renderTopRiskTools(rows, toolPolicyOverview) {
      const container = document.getElementById('tool-policy-top-risk-tools');
      const overview = (toolPolicyOverview && typeof toolPolicyOverview === 'object') ? toolPolicyOverview : null;
      if (overview && Array.isArray(overview.top_risk_tools_7d)) {
        const topItemsFromOverview = overview.top_risk_tools_7d
          .filter((item) => item && typeof item === 'object')
          .map((item, index) => `${index + 1}. ${String(item.tool_name || '<unknown>')}（${Number(item.count || 0)}）`)
          .slice(0, 5);
        if (topItemsFromOverview.length > 0) {
          container.textContent = `高風險工具 Top 5：${topItemsFromOverview.join('、')}`;
          return;
        }
      }
      const riskRows = rows.filter((row) => {
        const risk = String(row.risk_level || '');
        return risk === 'dangerous' || risk === 'restricted';
      });
      if (!riskRows.length) {
        container.textContent = '高風險工具 Top N：目前無資料';
        return;
      }
      const counterMap = new Map();
      for (const row of riskRows) {
        const toolName = String(row.tool_name || '-');
        counterMap.set(toolName, Number(counterMap.get(toolName) || 0) + 1);
      }
      const topItems = Array.from(counterMap.entries())
        .sort((left, right) => Number(right[1]) - Number(left[1]))
        .slice(0, 5)
        .map(([toolName, count], index) => `${index + 1}. ${toolName}（${count}）`);
      container.textContent = `高風險工具 Top 5：${topItems.join('、')}`;
    }

    function renderToolExecutionAudits(payload) {
      const summaryContainer = document.getElementById('tool-policy-audit-summary');
      const container = document.getElementById('tool-policy-audits');
      const rows = Array.isArray(payload.items) ? payload.items : [];
      summaryContainer.innerHTML = buildAuditSummaryRows(rows, latestToolPolicyOverview).join('');
      renderTopRiskTools(rows, latestToolPolicyOverview);
      if (!rows.length) {
        container.innerHTML = '<div class="mono">目前無符合條件的工具稽核紀錄</div>';
        return;
      }
      const htmlRows = rows.map((row) => {
        const createdAt = row.created_at ? new Date(row.created_at).toLocaleString() : '-';
        const risk = String(row.risk_level || '-');
        const status = String(row.status || '-');
        const denyReason = String(row.deny_reason || '') || '-';
        const userText = row.user_id ? `${String(row.user_id).slice(0, 8)}...` : '-';
        const costText = (typeof row.cost_estimate === 'number' && Number.isFinite(row.cost_estimate)) ? Number(row.cost_estimate).toFixed(6) : '-';
        const detailText = JSON.stringify(row.details || {}, null, 2);
        const payloadText = JSON.stringify(row.payload_keys || [], null, 2);
        const detailBlock = `{\n  "details": ${detailText},\n  "payload_keys": ${payloadText}\n}`;
        const escapedDetailBlock = escapeHtml(detailBlock);
        const detailRowId = `audit-detail-${String(row.id || '').replace(/[^a-zA-Z0-9_-]/g, '')}`;
        return `<tr>
          <td>${createdAt}</td>
          <td>${row.tool_name || '-'}</td>
          <td><span class="${getRiskClass(risk)}">${risk}</span></td>
          <td>${status}</td>
          <td>${denyReason}</td>
          <td>${userText}</td>
          <td class="num">${costText}</td>
          <td><span class="audit-detail-toggle" data-detail-row-id="${detailRowId}">查看</span></td>
        </tr>
        <tr id="${detailRowId}" class="audit-detail-row" style="display:none;">
          <td colspan="8"><pre class="audit-detail-pre">${escapedDetailBlock}</pre></td>
        </tr>`;
      }).join('');
      container.innerHTML = `
        <table class="metrics">
          <thead>
            <tr>
              <th>時間</th>
              <th>工具</th>
              <th>風險</th>
              <th>狀態</th>
              <th>拒絕原因</th>
              <th>使用者</th>
              <th class="num">成本估算</th>
              <th>詳情</th>
            </tr>
          </thead>
          <tbody>${htmlRows}</tbody>
        </table>
      `;
      container.querySelectorAll('[data-detail-row-id]').forEach((toggleNode) => {
        toggleNode.addEventListener('click', () => {
          const rowId = String(toggleNode.getAttribute('data-detail-row-id') || '').trim();
          if (!rowId) return;
          const targetRow = document.getElementById(rowId);
          if (!targetRow) return;
          const isHidden = targetRow.style.display === 'none';
          targetRow.style.display = isHidden ? '' : 'none';
          toggleNode.textContent = isHidden ? '收合' : '查看';
        });
      });
    }

    async function loadToolExecutionAudits() {
      const statusFilter = document.getElementById('audit-status-filter').value;
      const riskFilter = document.getElementById('audit-risk-filter').value;
      const query = new URLSearchParams({ days: '7', limit: '20' });
      if (statusFilter) query.set('status', statusFilter);
      if (riskFilter) query.set('risk_level', riskFilter);
      const payload = await api.get(`/admin/tool-execution-audits?${query.toString()}`);
      renderToolExecutionAudits(payload || {});
      hasLoadedToolAudits = true;
    }

    async function loadOverview() {
      const data = await api.get('/admin/dashboard/overview');
      renderOverview(data);
    }

    async function refreshWithGuard() {
      try {
        await loadOverview();
        await loadToolExecutionAudits();
      } catch (e) {
        document.getElementById('updated-at').textContent = `載入失敗：${(e && e.message) || 'unknown'}`;
      }
    }

    async function connectRealtimeStream() {
      const token = localStorage.getItem('auth_token') || '';
      const resp = await fetch('/api/admin/dashboard/stream', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!resp.ok || !resp.body) {
        throw new Error(`SSE 連線失敗：HTTP ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) throw new Error('SSE 已中斷');
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const chunk = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          if (!chunk.startsWith('data: ')) continue;
          try {
            const payload = JSON.parse(chunk.replace(/^data:\s*/, ''));
            if (payload && payload.type === 'overview' && payload.payload) {
              renderOverview(payload.payload);
            }
          } catch {}
        }
      }
    }

    async function runRealtimeOrFallback() {
      try {
        await connectRealtimeStream();
      } catch (e) {
        document.getElementById('updated-at').textContent = `即時串流中斷，改用輪詢：${(e && e.message) || 'unknown'}`;
        refreshWithGuard();
        setInterval(refreshWithGuard, 15000);
      }
    }

    async function loadLogs(level = '') {
      try {
        let url = '/logs?limit=50';
        if (level) {
          url += `&level=${level}`;
        }
        const response = await api.get(url);
        const container = document.getElementById('logs-list');

        if (!Array.isArray(response.logs) || response.logs.length === 0) {
          container.innerHTML = '<p>尚無日誌記錄</p>';
          logsLoaded = true;
          return;
        }

        container.innerHTML = `
          <div class="table-wrap">
            <table class="logs">
              <thead>
                <tr>
                  <th>時間</th>
                  <th>級別</th>
                  <th>動作</th>
                  <th>資源類型</th>
                  <th>使用者 ID</th>
                </tr>
              </thead>
              <tbody>
                ${response.logs.map(log => `
                  <tr>
                    <td>${new Date(log.timestamp).toLocaleString()}</td>
                    <td>${log.level}</td>
                    <td>${log.action}</td>
                    <td>${log.resource_type || '-'}</td>
                    <td>${log.user_id ? `${String(log.user_id).substring(0, 8)}...` : '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
        logsLoaded = true;
      } catch (e) {
        document.getElementById('logs-list').innerHTML = `<p>載入失敗：${(e && e.message) || 'unknown'}</p>`;
      }
    }

    async function initializeDashboardPage() {
      const capabilities = await getCapabilities({ forceRefresh: true });
      hasMonitorPermission = hasAnyPermission(capabilities, ['dashboard.read']);
      hasLogsPermission = hasAnyPermission(capabilities, ['logs.read']);
      if (!hasMonitorPermission && !hasLogsPermission) {
        window.location.href = '/pages/chat.html';
        return;
      }

      const monitorTab = document.getElementById('tab-monitor');
      const logsTab = document.getElementById('tab-logs');

      if (!hasMonitorPermission) {
        monitorTab.style.display = 'none';
        document.getElementById('monitor-panel').classList.remove('active');
      } else {
        monitorTab.addEventListener('click', () => setActiveTab('monitor'));
        document.getElementById('refresh-btn').addEventListener('click', refreshWithGuard);
        document.getElementById('audit-refresh-btn').addEventListener('click', async () => {
          try {
            await loadToolExecutionAudits();
          } catch (error) {
            document.getElementById('tool-policy-audits').innerHTML = `<div class="mono">稽核載入失敗：${(error && error.message) || 'unknown'}</div>`;
          }
        });
        document.getElementById('audit-status-filter').addEventListener('change', async () => {
          if (!hasLoadedToolAudits) return;
          await loadToolExecutionAudits();
        });
        document.getElementById('audit-risk-filter').addEventListener('change', async () => {
          if (!hasLoadedToolAudits) return;
          await loadToolExecutionAudits();
        });
        await refreshWithGuard();
        runRealtimeOrFallback();
      }

      if (!hasLogsPermission) {
        logsTab.style.display = 'none';
        document.getElementById('logs-panel').classList.remove('active');
      } else {
        logsTab.addEventListener('click', () => setActiveTab('logs'));
        document.getElementById('level-filter').addEventListener('change', (event) => {
          loadLogs(event.target.value);
        });
      }

      setActiveTab(hasMonitorPermission ? 'monitor' : 'logs');
    }

    initializeDashboardPage();

    // 登出事件由 /main.js 統一掛載，並提供確認視窗
  </script>
</body>
</html>
