<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能管理</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><h1>dyagent</h1></div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <h2>技能管理</h2>
    <div id="error-message" class="error-message"></div>
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
      <button id="btn-new" class="btn btn-primary" type="button">新增技能</button>
    </div>
    <table class="table">
      <thead>
        <tr><th>名稱</th><th>狀態</th><th>類型</th><th>說明</th><th>操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script type="module">
    import { api, auth, showError } from '/main.js';
    if (!auth.isAuthenticated()) { window.location.href = '/pages/login.html'; }
    const user = auth.getUser();
    if (!user || user.role !== 'admin') {
      document.getElementById('error-message').textContent = '僅限管理者存取';
      setTimeout(() => { window.location.href = '/pages/chat.html'; }, 1200);
      throw new Error('forbidden');
    }
    const rows = document.getElementById('rows');
    async function load() {
      try {
        const res = await api.get('/skills');
        const list = Array.isArray(res.skills) ? res.skills : [];
        rows.innerHTML = list.map(s => {
          return `<tr>
            <td>${s.name}</td>
            <td>${s.enabled ? '啟用' : '停用'}</td>
            <td>${s.type || 'webhook'}</td>
            <td>${s.description || ''}</td>
            <td>
              <a class="btn" href="/pages/skill-edit.html?id=${s.id}">編輯</a>
              <button class="btn" data-del="${s.id}">刪除</button>
            </td>
          </tr>`;
        }).join('');
      } catch (e) { showError(e.message || '載入失敗'); }
    }
    rows.addEventListener('click', async (e) => {
      const id = e.target.getAttribute('data-del');
      if (id) {
        const ok = window.confirm('確定刪除此技能？');
        if (!ok) return;
        try { await api.delete(`/skills/${id}`); load(); } catch (e) { showError(e.message || '刪除失敗'); }
      }
    });
    document.getElementById('btn-new').addEventListener('click', ()=>{ window.location.href = '/pages/skill-edit.html'; });
    load();
  </script>
</body>
</html>
