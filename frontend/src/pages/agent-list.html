<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理者列表 - dyagent</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <h1>dyagent</h1>
    </div>
    <div class="nav-menu">
      <a href="/pages/dashboard.html">儀表板</a>
      <a href="/pages/agent-list.html">代理者</a>
      <a href="/pages/chat.html">聊天</a>
      <a href="/pages/login.html" id="auth-link">登入</a>
    </div>
  </nav>
  <main class="container">
    <div class="actions">
      <h2>代理者列表</h2>
      <a href="/pages/create-agent.html" class="btn btn-primary">創建代理者</a>
    </div>
    <div id="error-message" class="error-message"></div>
    <div id="agents-list" class="card">
      <p>載入中...</p>
    </div>
  </main>
  <script type="module">
    import { api, auth, showError } from '/main.js';

    if (!auth.isAuthenticated()) {
      window.location.href = '/pages/login.html';
    }

    async function loadAgents() {
      try {
        const response = await api.get('/agents');
        const container = document.getElementById('agents-list');
        
        if (response.agents.length === 0) {
          container.innerHTML = '<p>尚未建立任何代理者</p>';
          return;
        }

        const integrationsEntries = await Promise.all(
          response.agents.map(async (agent) => {
            try {
              const res = await api.get(`/agents/${agent.id}/integrations`);
              const skills = Array.isArray(res.skills) ? res.skills.map((x) => String(x || '').trim()).filter(Boolean) : [];
              const mcpFromSchemas = (res.mcp_schemas && typeof res.mcp_schemas === 'object')
                ? Object.keys(res.mcp_schemas)
                    .filter((k) => k.startsWith('mcp:'))
                    .map((k) => k.replace(/^mcp:/, '').trim())
                    .filter(Boolean)
                : [];
              const mcpFromInline = Array.isArray(res.mcp_config)
                ? res.mcp_config
                    .map((c) => (c && c.name ? String(c.name).trim() : ''))
                    .filter(Boolean)
                : [];
              const mcpNames = Array.from(new Set([...mcpFromSchemas, ...mcpFromInline]));
              return [agent.id, { skills, mcpNames }];
            } catch {
              return [agent.id, { skills: [], mcpNames: [] }];
            }
          })
        );
        const integrationsByAgent = Object.fromEntries(integrationsEntries);

        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>名稱</th>
                <th>描述</th>
                <th>模型類型</th>
                <th>類別</th>
                <th>狀態</th>
                <th>MCPs</th>
                <th>Skills</th>
                <th>建立時間</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${response.agents.map(agent => `
                <tr>
                  <td>${agent.name}</td>
                  <td>${agent.description || '-'}</td>
                  <td>${agent.model_type}</td>
                  <td>${agent.agent_class || (agent.is_router ? 'master' : 'tasked')}</td>
                  <td>${agent.enabled === false ? '停用' : '啟用'}</td>
                  <td>${(integrationsByAgent[agent.id]?.mcpNames || []).join(', ') || '-'}</td>
                  <td>${(integrationsByAgent[agent.id]?.skills || []).join(', ') || '-'}</td>
                  <td>${new Date(agent.created_at).toLocaleDateString()}</td>
                  <td>
                    <a href="/pages/chat.html?agent=${agent.id}" class="btn btn-primary">聊天</a>
                    <a href="/pages/edit-agent.html?id=${agent.id}" class="btn btn-secondary">編輯</a>
                    <a href="/pages/agent-llm.html?id=${agent.id}" class="btn">LLM 設定</a>
                    <a href="/pages/agent-llm-config.html?id=${agent.id}" class="btn">工具設定</a>
                    <a href="/pages/agent-rag-config.html?id=${agent.id}" class="btn">RAG設定</a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        showError(error.message);
      }
    }

    loadAgents();
  </script>
</body>
</html>
