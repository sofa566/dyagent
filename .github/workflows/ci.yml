name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Initialize CI database schema
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/dyagent-ci.db
        run: python -c "import src.models; from src.core.database import Base, engine; Base.metadata.create_all(bind=engine)"

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:////tmp/dyagent-ci.db
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
        run: pytest backend/tests/integration/test_renal_care_api.py backend/tests/integration/test_health_education_api.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
